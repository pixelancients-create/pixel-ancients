name: Update league data

on:
  schedule:
    - cron: '7 * * * *'      # every hour
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch from OpenDota
        run: node scripts/build-data.js
        env:
          OPENDOTA_API_KEY: ${{ secrets.OPENDOTA_API_KEY }}
      - name: Commit data.json
        run: |
          git config user.name "league-bot"
          git config user.email "league-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update league data"
          git push
