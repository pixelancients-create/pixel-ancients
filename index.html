20x%3D%2210%22%20y%3D%225%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%234f8a2e%22%2F%3E%3Crect%20x%3D%2211%22%20y%3D%225%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23160d0a%22%2F%3E%3Crect%20x%3D%224%22%20y%3D%226%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23160d0a%22%2F%3E%3Crect%20x%3D%225%22%20y%3D%226%22%20width%3D%223%22%20height%3D%221%22%20fill%3D%22%23e8553e%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%226%22%20width%3D%222%22%20height%3D%221%22%20fill%3D%22%238fc84f%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%226%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%234f8a2e%22%2F%3E%3Crect%20x%3D%2211%22%20y%3D%226%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23160d0a%22%2F%3E%3Crect%20x%3D%224%22%20y%3D%227%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23160d0a%22%2F%3E%3Crect%20x%3D%225%22%20y%3D%227%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23a8321f%22%2F%3E%3Crect%20x%3D%226%22%20y%3D%227%22%20width%3D%222%22%20height%3D%221%22%20fill%3D%22%23e8553e%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%227%22%20width%3D%222%22%20height%3D%221%22%20fill%3D%22%238fc84f%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%227%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%234f8a2e%22%2F%3E%3Crect%20x%3D%2211%22%20y%3D%227%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23160d0a%22%2F%3E%3Crect%20x%3D%225%22%20y%3D%228%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23160d0a%22%2F%3E%3Crect%20x%3D%226%22%20y%3D%228%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23a8321f%22%2F%3E%3Crect%20x%3D%227%22%20y%3D%228%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23e8553e%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%228%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%238fc84f%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%228%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%234f8a2e%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%228%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23160d0a%22%2F%3E%3Crect%20x%3D%225%22%20y%3D%229%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23160d0a%22%2F%3E%3Crect%20x%3D%226%22%20y%3D%229%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23a8321f%22%2F%3E%3Crect%20x%3D%227%22%20y%3D%229%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23e8553e%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%229%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%238fc84f%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%229%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%234f8a2e%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%229%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23160d0a%22%2F%3E%3Crect%20x%3D%226%22%20y%3D%2210%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23160d0a%22%2F%3E%3Crect%20x%3D%227%22%20y%3D%2210%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23a8321f%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%2210%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%234f8a2e%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%2210%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23160d0a%22%2F%3E%3Crect%20x%3D%224%22%20y%3D%2211%22%20width%3D%228%22%20height%3D%221%22%20fill%3D%22%23160d0a%22%2F%3E%3Crect%20x%3D%223%22%20y%3D%2212%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23160d0a%22%2F%3E%3Crect%20x%3D%224%22%20y%3D%2212%22%20width%3D%227%22%20height%3D%221%22%20fill%3D%22%238d939a%22%2F%3E%3Crect%20x%3D%2211%22%20y%3D%2212%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%235a6168%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2212%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23160d0a%22%2F%3E%3Crect%20x%3D%222%22%20y%3D%2213%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23160d0a%22%2F%3E%3Crect%20x%3D%223%22%20y%3D%2213%22%20width%3D%229%22%20height%3D%221%22%20fill%3D%22%238d939a%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2213%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%235a6168%22%2F%3E%3Crect%20x%3D%2213%22%20y%3D%2213%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%23160d0a%22%2F%3E%3Crect%20x%3D%222%22%20y%3D%2214%22%20width%3D%2214%22%20height%3D%221%22%20fill%3D%22%23160d0a%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Fira+Sans:wght@400;500;600;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #050606;
    --bg: #0c0e0f;
    --panel: #15181a;
    --panel-2: #1b1f21;
    --line: rgba(255, 255, 255, .09);
    --line-warm: rgba(194, 60, 42, .35);
    --text: #e9e3da;
    --muted: #8e8981;
    --red: #c23c2a;
    --red-hot: #e8553e;
    --ember: #ff7a3d;
    --radiant: #8fc84f;
    --dire: #d6493a;
    --gold: #d8b25c;
    --silver: #b9bfc3;
    --bronze: #b7794b;
    --display: 'Cinzel', 'Trajan Pro', Georgia, serif;
    --body: 'Fira Sans', 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--void); }
  body {
    margin: 0; color: var(--text); font: 16px/1.55 var(--body); background: var(--bg); min-height: 100vh; overflow-x: hidden;
  }
  /* film grain over everything, very faint */
  body::after {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 50; opacity: .06; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  a { color: var(--red-hot); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums lining-nums; }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

  /* ---------- top bar ---------- */
  header.top {
    position: sticky; top: 0; z-index: 20; background: rgba(5, 6, 6, .92); backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255,255,255,.06);
  }
  header.top .wrap { display: flex; align-items: center; gap: 20px; min-height: 68px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; text-decoration: none; color: var(--text); }
  .brand span { font: 800 22px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; }
  nav.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  nav.tabs a {
    color: var(--muted); text-decoration: none; padding: 10px 10px; font: 600 14px/1 var(--body);
    letter-spacing: .12em; text-transform: uppercase; position: relative;
  }
  nav.tabs a:hover { color: var(--text); }
  nav.tabs a[aria-current="page"] { color: #fff; }
  nav.tabs a[aria-current="page"]::after {
    content: ''; position: absolute; left: 12px; right: 12px; bottom: -14px; height: 2px;
    background: var(--red-hot); box-shadow: 0 0 12px 1px rgba(232, 85, 62, .8);
  }
  .btn-red, .join {
    display: inline-flex; align-items: center; gap: 8px; text-decoration: none; cursor: pointer;
    background: linear-gradient(180deg, #d4432f 0%, #9e2a1c 100%); color: #fff; border: 1px solid #e8553e;
    padding: 11px 20px; font: 700 13px/1 var(--body); letter-spacing: .16em; text-transform: uppercase;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 6px 24px -8px rgba(194, 60, 42, .7);
    clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
  }
  .btn-red:hover, .join:hover { background: linear-gradient(180deg, #e8553e 0%, #b23222 100%); }
  .btn-red[disabled] { opacity: .35; cursor: default; }
  .join { padding: 10px 16px; font-size: 12px; white-space: nowrap; }

  .btn {
    background: transparent; border: 1px solid var(--line); padding: 8px 14px; cursor: pointer; color: var(--text);
    font: 600 12px/1 var(--body); letter-spacing: .14em; text-transform: uppercase;
  }
  .btn:hover { border-color: var(--red-hot); color: #fff; }
  .btn[disabled] { opacity: .3; cursor: default; border-color: var(--line); }

  .banner { background: rgba(194, 60, 42, .1); border-left: 3px solid var(--red); color: var(--text); padding: 12px 16px; margin-top: 18px; font-size: 15px; }
  .banner code { color: var(--ember); }
  .status { display: flex; gap: 14px; align-items: center; color: var(--muted); font-size: 13px; letter-spacing: .04em; margin: 16px 0 0; flex-wrap: wrap; }

  main { padding: 0 0 40px; }
  section.view { display: none; }
  section.view.active { display: block; }

  /* ---------- cinematic hero ---------- */
  .hero {
    position: relative; margin: 18px calc(50% - 50vw) 0; padding: 88px calc(50vw - 50%) 72px; overflow: hidden;
    background:
      radial-gradient(60% 90% at 78% 30%, rgba(232, 85, 62, .28), transparent 60%),
      radial-gradient(40% 60% at 92% 80%, rgba(255, 122, 61, .14), transparent 70%),
      radial-gradient(70% 100% at 10% 100%, rgba(0,0,0,.9), transparent 70%),
      linear-gradient(180deg, #120c0b 0%, #0c0e0f 100%);
    border-bottom: 1px solid var(--line-warm);
  }
  .hero::before { /* light shafts */
    content: ''; position: absolute; inset: -20% -10% 0 40%; pointer-events: none; opacity: .5;
    background: repeating-linear-gradient(105deg, transparent 0 46px, rgba(255, 140, 90, .05) 46px 54px, transparent 54px 120px);
    mask-image: radial-gradient(60% 70% at 60% 30%, #000, transparent 75%);
  }
  .hero > * { position: relative; }
  .hero .crest {
    position: absolute; right: max(24px, calc(50vw - 560px)); top: 50%; transform: translateY(-50%); pointer-events: none;
    font: 900 clamp(160px, 22vw, 300px)/.8 var(--display); color: transparent; letter-spacing: .02em;
    -webkit-text-stroke: 1.5px rgba(232, 85, 62, .32); text-shadow: 0 0 80px rgba(232, 85, 62, .18);
  }
  [hidden] { display: none !important; }

  /* ---------- pixel avatars ---------- */
  .ava { image-rendering: pixelated; display: inline-block; vertical-align: middle; flex: none; }
  .ava-sm { width: 40px; height: 40px; background: radial-gradient(circle at 50% 60%, #262c2f, #111416 72%); border: 1px solid var(--line); }
  .cell-player { display: inline-flex; align-items: center; gap: 12px; }
  .hero .champ {
    position: absolute; right: max(24px, calc(50vw - 560px)); bottom: 40px; width: min(28vw, 272px); height: auto; aspect-ratio: 1;
    filter: drop-shadow(0 0 36px rgba(232, 85, 62, .35)) drop-shadow(0 12px 24px rgba(0,0,0,.6));
  }
  .hero.compact { padding-top: 56px; padding-bottom: 44px; }

  .locker { display: grid; grid-template-columns: 340px 1fr; gap: 32px; margin-top: 40px; align-items: start; }
  .stage {
    position: sticky; top: 92px; padding: 24px; text-align: center; border: 1px solid var(--line-warm);
    background: radial-gradient(70% 60% at 50% 55%, rgba(232, 85, 62, .18), transparent 70%), linear-gradient(180deg, #17120f, #0d0f10);
  }
  .stage .stage-ava { width: 256px; height: 256px; image-rendering: pixelated; display: block; margin: 0 auto; }
  .stage .who { font: 800 26px/1.1 var(--display); text-transform: uppercase; letter-spacing: .04em; margin-top: 10px; }
  .stage .count { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .stage .next { text-align: left; border-top: 1px solid var(--line); margin-top: 18px; padding-top: 14px; font-size: 14px; }
  .stage .actions { display: flex; flex-direction: column; gap: 10px; align-items: center; margin-top: 18px; }
  .stage select { width: 100%; background: #0a0b0c; color: var(--text); border: 1px solid var(--line); padding: 10px; font: inherit; margin-bottom: 14px; }
  .slot-tabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  .slot-tabs button {
    background: none; border: 0; padding: 12px 14px; cursor: pointer; color: var(--muted);
    font: 600 13px/1 var(--body); letter-spacing: .16em; text-transform: uppercase; position: relative;
  }
  .slot-tabs button:hover { color: var(--text); }
  .slot-tabs button[aria-selected="true"] { color: #fff; }
  .slot-tabs button[aria-selected="true"]::after { content: ''; position: absolute; left: 14px; right: 14px; bottom: -1px; height: 2px; background: var(--red-hot); box-shadow: 0 0 10px var(--red-hot); }
  .slot-tabs .n { color: var(--muted); font-weight: 500; letter-spacing: 0; margin-left: 4px; }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 12px; }
  .item {
    background: linear-gradient(180deg, #1a1d1f, #121415); border: 1px solid var(--line); padding: 12px; text-align: left;
    cursor: pointer; color: var(--text); font: inherit; position: relative;
  }
  .item:hover:not(.locked) { border-color: rgba(232, 85, 62, .6); }
  .item > img { width: 96px; height: 96px; display: block; margin: 0 auto 10px; image-rendering: pixelated; }
  .item .rar { font: 700 10.5px/1 var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--rc); margin-bottom: 4px; }
  .slot-ic {
    display: inline-grid; place-items: center; width: 44px; height: 44px; flex: none; position: relative;
    background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--rc) 38%, transparent), #0b0d0e 78%);
    border: 1px solid var(--rc); box-shadow: inset 0 0 0 1px rgba(0,0,0,.6), inset 0 -10px 18px -10px var(--rc);
  }
  .slot-ic img { width: 84%; height: 84%; image-rendering: pixelated; }
  .slot-ic.big { width: 100%; height: auto; aspect-ratio: 1; margin-bottom: 10px; }
  .slot-ic.empty { --rc: rgba(255,255,255,.14); background: #0b0d0e; border-style: dashed; }
  .item.locked .slot-ic img { filter: grayscale(1) brightness(.35); }
  .slot-ic.r-unique { animation: uniqueGlow 1.8s ease-in-out infinite; }
  .item:has(.r-unique) { border-color: rgba(255, 59, 48, .45); }
  @keyframes uniqueGlow {
    0%, 100% { box-shadow: inset 0 0 0 1px rgba(0,0,0,.6), inset 0 -10px 18px -10px #ff3b30, 0 0 10px -2px rgba(255, 59, 48, .5); }
    50% { box-shadow: inset 0 0 0 1px rgba(0,0,0,.6), inset 0 -14px 22px -8px #ff3b30, 0 0 22px 2px rgba(255, 59, 48, .75); }
  }
  .item.locked .slot-ic.r-unique { animation: none; }
  .item.locked .slot-ic { box-shadow: inset 0 0 0 1px rgba(0,0,0,.6); }
  /* ---------- taunts ---------- */
  .bubble {
    position: relative; display: inline-block; max-width: 220px; padding: 7px 10px; z-index: 3;
    background: #f4efe7; color: #17110e; font: 600 13.5px/1.25 'Pixelify Sans', var(--body); letter-spacing: .01em;
    border: 2px solid #17110e; box-shadow: 3px 3px 0 rgba(0,0,0,.55); overflow-wrap: anywhere; text-align: left;
  }
  .bubble::after { content: ''; position: absolute; width: 9px; height: 9px; background: #f4efe7; border-right: 2px solid #17110e; border-bottom: 2px solid #17110e; }
  .hero .champ-wrap { position: absolute; right: max(24px, calc(50vw - 560px)); bottom: 40px; width: min(28vw, 272px); }
  .hero .champ-wrap .champ { position: static; width: 100%; display: block; }
  .champ-wrap .bubble, .stage-wrap .bubble { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); width: max-content; max-width: 220px; margin-bottom: 2px; }

  /* ---------- landing ---------- */
  .home-hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 32px; align-items: center; }

  .parade { position: relative; width: 100%; aspect-ratio: 16 / 11; }

    content: ''; position: absolute; left: 4%; right: 4%; bottom: 18px; height: 34px; border-radius: 50%;

  .explainer { scroll-margin-top: 84px; }

  .explainer .frame { position: relative; aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--line-warm); box-shadow: 0 40px 90px -50px rgba(194, 60, 42, .55); overflow: hidden; }
  .explainer .frame video, .explainer .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border: 0; background: #000; }
  .explainer .play { position: absolute; inset: 0; display: grid; place-items: center; background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.45)); border: 0; cursor: pointer; padding: 0; }
  .explainer .play span { width: 88px; height: 88px; border-radius: 50%; background: var(--red); display: grid; place-items: center; box-shadow: 0 0 0 10px rgba(194, 60, 42, .25), 0 12px 40px rgba(0,0,0,.5); transition: transform .15s; }

<script>
(() => {
  const CFG = window.LEAGUE_CONFIG;
  const S = window.LeagueScoring;
  const TZ = CFG.timezoneOffsetHours;
  const API = 'https://api.opendota.com/api';
  const $ = sel => document.querySelector(sel);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const state = {
    members: [], heroes: {}, raw: {}, league: [], scored: {}, elo: null,
    now: Math.floor(Date.now() / 1000), week: null, source: '', updatedAt: null, loading: false, errors: [],
    stats: {}, avatars: {}, sb: null, session: null, locker: { playerId: null, draft: null, tab: 'look', msg: '' },
    guilds: [], snaps: [], gReq: [], fights: [], fightSnaps: {}, invite: null, gMsg: '', ready: false,
    dbPlayers: [], reg: { input: '', look: null, msg: '', msgOk: false, linked: null }, admin: { isAdmin: null, msg: '', msgOk: false },
  };
  const A = window.LeagueAvatars;
  const FEAT = Object.assign({ league: true, avatars: true, guilds: false }, CFG.features || {});
  const seasonTitle = FEAT.league ? 'Season Grinder' : (FEAT.guilds && FEAT.avatars && window.LeagueBattle ? 'Season MVP' : 'Season Champion');
  A.configure({ league: FEAT.league });
  const MODES = S.countedModes(CFG);
  const MODE_NAME = { turbo: 'Turbo', allpick: 'All Pick' };
  const MULTI = MODES.length > 1;
  const modesAnd = MODES.map(m => MODE_NAME[m]).join(' and '), modesOr = MODES.map(m => MODE_NAME[m]).join(' or ');
  const MIN_GAMES = CFG.scoring.minGames || 0;
  const partyChip = (e, title = '') => `<span class="tag party p${e.party}"${title ? ` title="${title}"` : ''}>${S.partyLabel(e.party)}</span>`;
  const AV = CFG.avatars || {};
  const loginEnabled = !CFG.demo && !!(AV.supabaseUrl && AV.supabaseAnonKey);
  const selfLink = CFG.demo || loginEnabled;     // players link their own Dota account after logging in with Discord

  // ---------- storage (cache) ----------
  const store = {
    get(k) { try { const v = localStorage.getItem('dl:' + k); return v ? JSON.parse(v) : null; } catch { return null; } },
    set(k, v) { try { localStorage.setItem('dl:' + k, JSON.stringify(v)); } catch {} },
  };

  // ---------- OpenDota fetch with a gentle rate limit ----------
  let lastCall = 0;
  async function od(path, tries = 3) {
    const wait = Math.max(0, lastCall + 1050 - Date.now());
    if (wait) await new Promise(r => setTimeout(r, wait));
    lastCall = Date.now();
    const res = await fetch(API + path);
    if (res.status === 429 && tries > 1) { await new Promise(r => setTimeout(r, 6000)); return od(path, tries - 1); }
    if (!res.ok) throw new Error(`OpenDota ${res.status} for ${path}`);
    return res.json();
  }

  const slimPub = m => Object.fromEntries(S.MATCH_FIELDS.map(f => [f, m[f]]));   // keep only the fields scoring and gear use
  const slimLeague = m => ({ match_id: m.match_id, radiant_win: m.radiant_win, start_time: m.start_time, duration: m.duration,
    players: (m.players || []).map(p => ({ account_id: p.account_id, player_slot: p.player_slot, hero_id: p.hero_id,
      kills: p.kills, deaths: p.deaths, assists: p.assists, personaname: p.personaname })) });

  function fetchWindowDays() {
    const seasonStart = S.parseLocalDate(CFG.season.start, TZ);
    const prevWeek = S.dayToTs(S.weekStartDay(state.now, TZ) - 7, TZ);
    const from = Math.min(seasonStart, prevWeek);
    return Math.max(1, Math.ceil((state.now - from) / 86400) + 1);
  }

  async function loadLive(force) {
    const ttl = CFG.cacheMinutes * 60 * 1000;
    const total = state.members.length + (FEAT.league ? CFG.leagueMatches.length : 0) + 1;
    let done = 0;
    const tick = () => { done++; renderStatus(done / total); };

    const heroes = store.get('heroes');
    if (heroes && Date.now() - heroes.t < 7 * 864e5) state.heroes = heroes.v;
    else {
      try {
        const list = await od('/heroes');
        state.heroes = Object.fromEntries(list.map(h => [h.id, h.localized_name]));
        store.set('heroes', { t: Date.now(), v: state.heroes });
      } catch (e) { state.errors.push('Hero names could not load.'); }
    }
    tick();

    const days = fetchWindowDays();
    let oldest = Date.now();
    for (const p of state.members) {
      const key = 'm2:' + p.id + ':' + days;   // m2: rows now carry last hits, damage etc.
      const cached = store.get(key);
      if (!force && cached && Date.now() - cached.t < ttl) { state.raw[p.id] = cached.v; oldest = Math.min(oldest, cached.t); tick(); continue; }
      try {
        const rows = await od(`/players/${p.id}/matches?date=${days}&significant=0&${S.matchesQuery()}`);
        state.raw[p.id] = rows.map(slimPub);
        store.set(key, { t: Date.now(), v: state.raw[p.id] });
      } catch (e) {
        state.raw[p.id] = cached ? cached.v : [];
        state.errors.push(`Couldn't load matches for ${p.name}.`);
      }
      tick();
    }
    for (const id of (FEAT.league ? CFG.leagueMatches : [])) {
      const key = 'lm:' + id;
      const cached = store.get(key);
      if (cached) { state.league.push(cached); tick(); continue; } // finished matches never change
      try {
        const m = await od(`/matches/${id}`);
        if (m && m.players && m.players.length) { const s = slimLeague(m); state.league.push(s); store.set(key, s); }
        else state.errors.push(`League match ${id} isn't on OpenDota yet. Request a parse for it on opendota.com.`);
      } catch (e) { state.errors.push(`League match ${id} couldn't load. Request a parse for it on opendota.com.`); }
      tick();
    }
    state.source = 'OpenDota';
    state.updatedAt = force ? Date.now() : oldest;
  }

  async function loadDataFile() {
    try {
      const res = await fetch('data.json', { cache: 'no-store' });
      if (!res.ok) return false;
      const d = await res.json();
      if (!d.generatedAt || Date.now() - d.generatedAt > 3 * 3600 * 1000) return false; // stale: fall back to live
      state.heroes = d.heroes || {};
      state.raw = d.players || {};
      state.league = FEAT.league ? (d.leagueMatches || []) : [];
      state.source = 'hourly data file';
      state.updatedAt = d.generatedAt;
      return true;
    } catch { return false; }
  }

  // Players who linked their own account live in Supabase; everyone else is in config.js.
  async function loadRoster() {
    state.dbPlayers = [];
    if (state.sb) {
      const { data, error } = await state.sb.from('players').select('discord_id, account_id, name, linked_at').order('linked_at');
      if (error) state.errors.push('Linked players could not load right now. Showing players from config.js only.');
      else state.dbPlayers = Array.isArray(data) ? data : [];
    }
    state.members = S.mergeRoster(CFG.players, state.dbPlayers);
  }

  // Someone who linked after the last hourly data file: fetch just their games from OpenDota.
  async function loadMissing() {
    const days = fetchWindowDays();
    for (const p of state.members) {
      if (state.raw[p.id]) continue;
      const key = 'm2:' + p.id + ':' + days, cached = store.get(key);
      if (cached && Date.now() - cached.t < CFG.cacheMinutes * 60 * 1000) { state.raw[p.id] = cached.v; continue; }
      try {
        const rows = await od(`/players/${p.id}/matches?date=${days}&significant=0&${S.matchesQuery()}`);
        state.raw[p.id] = rows.map(slimPub); store.set(key, { t: Date.now(), v: state.raw[p.id] });
      } catch { state.raw[p.id] = cached ? cached.v : []; state.errors.push(`Couldn't load matches for ${p.name}.`); }
    }
  }

  function recompute() {
    state.scored = S.scorePubs(state.members, state.raw, CFG);
    state.elo = S.computeElo(state.members, state.league, CFG);
    state.stats = A.computeStats(state.members, state.scored, state.elo, CFG, state.now);
  }

  async function load(force) {
    state.loading = true; state.errors = []; state.raw = {}; state.league = [];
    renderStatus(0);
    if (CFG.demo) {
      const d = window.LEAGUE_DEMO.generate(CFG);
      state.members = d.members; state.heroes = d.heroes; state.raw = d.raw; state.league = FEAT.league ? d.league : [];
      Object.entries(d.taunts || {}).forEach(([id, t]) => { const k = 'demo:' + id; state.avatars[k] = { ...(state.avatars[k] || {}), ...t }; });
      state.now = d.now; state.source = 'sample data'; state.updatedAt = d.now * 1000;
    } else {
      await loadRoster();
      state.now = Math.floor(Date.now() / 1000);
      if (force || !(await loadDataFile())) await loadLive(force);
      else await loadMissing();
    }
    recompute();
    if (state.week == null) state.week = S.weekStartDay(state.now, TZ);
    await loadAvatars();
    try { await loadGuilds(); }
    catch (e) { state.guilds = []; state.fights = []; state.errors.push('Guilds could not load right now. Everything else works.'); }
    state.loading = false; state.ready = true;
    renderAll();
    if (state.pendingJoin) { const c = state.pendingJoin; state.pendingJoin = null; handleJoinLink(c); }
  }

  // ---------- formatting ----------
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const localDate = ts => new Date((ts + TZ * 3600) * 1000);
  const fmtDay = ts => { const d = localDate(ts); return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`; };
  const fmtDateTime = ts => { const d = localDate(ts); return `${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getUTCDay()]} ${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}, ${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`; };
  const weekLabel = w => { const { start, end } = S.weekRange(w, TZ); return `${fmtDay(start)} – ${fmtDay(end - 1)}`; };
  const heroName = id => state.heroes[id] || `Hero ${id}`;
  const heroChip = id => { const n = heroName(id); const ini = n.split(/[\s-]+/).map(w => w[0]).join('').slice(0, 2); return `<span class="hero-chip" aria-hidden="true">${esc(ini)}</span>`; };
  const modeLabel = m => MODE_NAME[m] || m;
  const ago = ms => { const m = Math.round((Date.now() - ms) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : `${Math.round(m / 60)} h ago`; };
  const seasonWeekIndex = w => S.seasonWeeks(CFG).indexOf(w);
  const signed = n => (n > 0 ? `+${n}` : `${n}`);
  const bigNum = n => (n >= 10000 ? `${+(n / 1000).toFixed(n % 1000 ? 1 : 0)}k` : n.toLocaleString('en-US'));
  const toRoman = n => { if (!n || n < 1 || n > 39) return ''; let s = ''; for (const [v, r] of [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]) while (n >= v) { s += r; n -= v; } return s; };
  const joinNames = rows => { const n = rows.map(r => r.name); return n.length > 3 ? `${n.length} players` : n.length === 1 ? n[0] : `${n.slice(0, -1).join(', ')} and ${n.at(-1)}`; };

  // ---------- render ----------
  function renderStatus(progress) {
    const el = $('#status');
    if (state.loading) {
      el.innerHTML = `<span>Loading match data from OpenDota…</span><span class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round((progress||0)*100)}"><i style="width:${Math.round((progress || 0) * 100)}%"></i></span>`;
      return;
    }
    const src = CFG.demo ? 'sample data' : `${state.source}, updated ${ago(state.updatedAt)}`;
    el.innerHTML = `<span>${state.members.length} players${FEAT.league ? ` and ${state.league.length} league matches` : ''} from ${esc(src)}</span>` +
      (CFG.demo ? '' : `<button class="btn" id="refresh">Refresh now</button>`);
    const r = $('#refresh'); if (r) r.onclick = () => load(true);
  }

  function renderBanner() {
    const parts = [];
    if (CFG.demo) parts.push('You\'re looking at sample data with made-up players. Set <code>demo: false</code> in config.js and add real players to go live.');
    if (!CFG.demo && !state.members.length) parts.push(selfLink ? 'No players yet. Players join from the <a href="#register">Join</a> page: log in with Discord, then enter a Friend ID.' : 'No players yet. Use the Register page to check an account, then add it to config.js.');
    state.errors.slice(0, 4).forEach(e => parts.push(esc(e)));
    $('#banner').innerHTML = parts.map(p => `<div class="banner">${p}</div>`).join('');
  }

  function renderWeekly() {
    const idx = seasonWeekIndex(state.week);
    const thisWeek = S.weekStartDay(state.now, TZ);
    const isCurrent = state.week === thisWeek;
    const rows = S.weeklyTable(state.members, state.scored, state.week, CFG, { final: state.week < thisWeek });
    const active = rows.filter(r => r.games > 0);
    const ranked = active.filter(r => r.rank != null);           // finished weeks: only players who qualified
    const unranked = active.filter(r => r.rank == null);
    const leader = ranked[0];
    const top = leader ? ranked.filter(r => r.rank === 1) : [];
    const title = leader ? (top.length > 1 ? joinNames(top) : leader.name) : (isCurrent ? 'The week is open' : 'A quiet week');
    const tagline = leader
      ? (top.length > 1 ? `${isCurrent ? 'Tied' : 'Shared the week'} at <span class="pts num">${leader.points}</span> points`
              : `${isCurrent ? 'Leads the week' : 'Won the week'} with <span class="pts num">${leader.points}</span> points`)
      : (isCurrent ? 'Nobody has scored yet. Your next game could put you on top.' : 'No points were scored that week.');
    const sub = leader
      ? `${active.length} of ${rows.length} players have played. ${isCurrent ? `Points lock in Sunday at midnight.${MIN_GAMES ? ` Play ${MIN_GAMES} games to qualify for the top 3.` : ''}` : (unranked.length ? `${unranked.length} played fewer than ${MIN_GAMES} games and weren't ranked.` : '')}`
      : (isCurrent || !active.length ? `Play ${modesOr} to get on the board.` : `Nobody played ${MIN_GAMES} games, so nobody was ranked.`);

    const ORD = n => ['1ST', '2ND', '3RD'][n - 1] || `${n}TH`;
    const top3 = ranked.slice(0, 3);
    const podium = [1, 0, 2].map(i => {
      const r = top3[i];
      if (!r) return `<div class="spot p${i + 1} vacant" aria-hidden="true"><div class="block"></div></div>`;
      return `
      <div class="spot p${i + 1}">
        ${FEAT.avatars ? `<div class="pod-top">${podiumBubble(r.id)}${podiumAvatar(r.id)}</div>` : ''}
        <div class="block">
          <div class="place">${ORD(r.rank || i + 1)}</div>
          <div class="who">${esc(r.name)}</div>
          <div class="val"><b class="num">${r.points}</b> pts · <span class="w">${r.wins}W</span> <span class="l">${r.losses}L</span></div>
          ${!r.qualified ? `<div class="needs">Needs ${r.needs} more game${r.needs === 1 ? '' : 's'}</div>` : ''}
        </div>
      </div>`;
    }).join('');

    const body = rows.map(r => `
      <tr class="player" data-id="${r.id}" tabindex="0" aria-expanded="false">
        <td class="rank num ${r.rank && r.rank <= 3 && r.games ? 'top' : ''}">${r.games && r.rank ? r.rank : '–'}</td>
        <td><span class="cell-player">${avaImg(r.id, 'ava-sm')}<span><span class="name">${esc(r.name)}</span> <span class="chev" aria-hidden="true">›</span>${r.played && !r.qualified ? ` <span class="tag q" title="${r.needs} more counted games to qualify for the top 3">${r.played}/${MIN_GAMES}</span>` : ''}${r.tiebreak && r.played ? `<span class="tb">Tiebreak: KDA ${r.kda.toFixed(1)}</span>` : ''}</span></span></td>
        <td class="r points num">${r.points}</td>
        <td class="r num"><span class="w">${r.wins}</span>–<span class="l">${r.losses}</span>${r.abandons ? ` <span class="tag Abandon">${r.abandons} ab</span>` : ''}</td>
        ${MULTI ? MODES.map(m => `<td class="r num hide-sm">${r[m]}</td>`).join('') : ''}
        <td class="r num hide-sm">${r.played ? r.kda.toFixed(1) : '–'}</td>
        <td class="r num hide-sm">${r.played}${CFG.scoring.weeklyCap ? `<span class="of">/${CFG.scoring.weeklyCap}</span>` : ''}</td>
      </tr>`).join('');

    $('#view-weekly').innerHTML = `
      <div class="hero">
        <div class="crest" aria-hidden="true">${idx >= 0 ? toRoman(idx + 1) : ''}</div>
        <div class="weeknav">
          <button class="btn" id="prevWeek" aria-label="Previous week">‹</button>
          <span class="eyebrow">${idx >= 0 ? `${esc(CFG.season.name)} · Week ${idx + 1}` : 'Off-season'} · ${weekLabel(state.week)}</span>
          <button class="btn" id="nextWeek" aria-label="Next week" ${state.week >= thisWeek ? 'disabled' : ''}>›</button>
        </div>
        <h1 class="${title.length > 22 ? 'long' : ''}">${esc(title)}</h1>
        <p class="tagline">${tagline}</p>
        <p class="sub">${sub}</p>
      </div>
      ${active.length ? `<div class="podium">${podium}</div>` : ''}
      ${lootStrip(weeklyUnlocks(state.week), isCurrent)}
      <div class="section-head">
        <div><div class="eyebrow">Weekly points</div><h2>Standings</h2></div>
        <div class="status" style="margin:0"><span id="copyMsg" role="status"></span><button class="btn-red" id="copyDiscord" ${ranked.length ? '' : 'disabled'}>Copy for Discord</button></div>
      </div>
      ${rows.length ? `
      <table class="table" id="weeklyTable">
        <thead><tr><th>#</th><th>Player</th><th class="r">Points</th><th class="r">W–L</th>${MULTI ? MODES.map(m => `<th class="r hide-sm">${MODE_NAME[m]}</th>`).join('') : ''}<th class="r hide-sm">KDA</th><th class="r hide-sm">Games</th></tr></thead>
        <tbody>${body}</tbody>
      </table>` : `<div class="empty"><strong>No players registered.</strong> Add players to config.js to start the leaderboard.</div>`}`;

    $('#prevWeek').onclick = () => { state.week -= 7; renderWeekly(); };
    $('#nextWeek').onclick = () => { state.week += 7; renderWeekly(); };
    $('#copyDiscord').onclick = () => copyDiscord(ranked, unranked, isCurrent);
    document.querySelectorAll('#weeklyTable tr.player').forEach(tr => {
      const toggle = () => toggleDetail(tr, rows.find(r => String(r.id) === tr.dataset.id));
      tr.onclick = toggle;
      tr.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } };
    });
  }

  function toggleDetail(tr, row) {
    const next = tr.nextElementSibling;
    if (next && next.classList.contains('detail')) { next.remove(); tr.classList.remove('open'); tr.setAttribute('aria-expanded', 'false'); return; }
    tr.classList.add('open'); tr.setAttribute('aria-expanded', 'true');
    const nameOf = id => (state.members.find(m => m.id === id) || {}).name || id;
    const items = row.entries.map(e => `
      <tr class="${e.counted ? '' : 'skip'}">
        <td>${fmtDateTime(e.start_time)}</td>
        <td>${modeLabel(e.mode)}</td>
        <td>${heroChip(e.hero_id)}${esc(heroName(e.hero_id))}</td>
        <td class="${e.result === 'win' ? 'w' : e.result ? 'l' : ''}">${e.result === 'abandon' ? 'Abandon' : e.result === 'win' ? 'Win' : e.result === 'loss' ? 'Loss' : '–'}</td>
        <td class="num hide-sm">${e.kills}/${e.deaths}/${e.assists}</td>
        <td class="num">${e.counted ? signed(e.points) : '0'}</td>
        <td>${partyChip(e, e.stackWith ? `With ${esc(e.stackWith.map(nameOf).join(', '))}` : '')}${e.tags.filter(t => t !== 'Stack' && t !== 'KDA').map(t => `<span class="tag ${t.replace(/\s+/g, '-')}">${t}</span>`).join('')}</td>
      </tr>`).join('');
    const d = document.createElement('tr');
    d.className = 'detail';
    d.innerHTML = `<td colspan="${MULTI ? 6 + MODES.length : 6}">${row.entries.length ? `<table class="mini"><thead><tr><th>When</th><th>Mode</th><th>Hero</th><th>Result</th><th class="hide-sm">K/D/A</th><th>Pts</th><th></th></tr></thead><tbody>${items}</tbody></table>`
      : `<p style="color:var(--muted);margin:10px 0 0">No ${modesAnd} games this week.</p>`}</td>`;
    tr.after(d);
  }

  async function copyDiscord(active, unranked = [], live = false) {
    const idx = seasonWeekIndex(state.week);
    const medals = ['🥇', '🥈', '🥉'];
    const lines = [`**${CFG.leagueName} — Weekly Points, ${idx >= 0 ? `${CFG.season.name} week ${idx + 1} ` : ''}(${weekLabel(state.week)})**`, ''];
    active.slice(0, 10).forEach(r => {
      const podium = r.rank <= 3;
      lines.push(`${podium ? medals[r.rank - 1] : `**${r.rank}.**`} ${podium ? `**${r.name}**` : r.name} — ${r.points} pts (${r.wins}W ${r.losses}L)${r.tiebreak ? `, KDA ${r.kda.toFixed(1)}` : ''}${live && !r.qualified ? ' _(qualifying)_' : ''}`);
      const t = podium ? tauntOf(r.id).text : '';
      if (t) lines.push(`> 💬 ${t}`);
    });
    if (unranked.length) lines.push('', `_Not ranked (under ${MIN_GAMES} games): ${unranked.map(r => r.name).join(', ')}_`);
    const loot = weeklyUnlocks(state.week);
    if (loot.length) {
      lines.push('', '🎁 **New gear unlocked**');
      loot.slice(0, 6).forEach(u => lines.push(`• ${u.m.name} unlocked **${u.it.name}** (${rarityOf(u.it).name})`));
      if (loot.length > 6) lines.push(`…and ${loot.length - 6} more`);
    }
    lines.push('', `Full table: ${location.href.split('#')[0]}#weekly`);
    const msg = $('#copyMsg');
    try { await navigator.clipboard.writeText(lines.join('\n')); msg.textContent = 'Copied. Paste it in #weekly-leaderboard.'; }
    catch { msg.textContent = 'Copy was blocked by the browser. Select the text below instead.'; msg.insertAdjacentHTML('afterend', `<pre class="code" style="width:100%">${esc(lines.join('\n'))}</pre>`); }
  }

  function renderLeague() {
    const { ladder, provisional, matches } = state.elo;
    const row = p => `
      <tr>
        <td class="rank num ${p.rank && p.rank <= 3 ? 'top' : ''}">${p.rank || '–'}</td>
        <td><span class="cell-player">${avaImg(p.id, 'ava-sm')}<span class="name">${esc(p.name)}</span></span></td>
        <td class="r points num">${p.rating}</td>
        <td class="r num ${p.last > 0 ? 'delta-up' : p.last < 0 ? 'delta-down' : ''}">${p.games ? signed(p.last) : ''}</td>
        <td class="r num"><span class="w">${p.wins}</span>–<span class="l">${p.losses}</span></td>
        <td class="r num hide-sm">${p.games}</td>
      </tr>`;
    const head = `<thead><tr><th>#</th><th>Player</th><th class="r">ELO</th><th class="r">Last</th><th class="r">W–L</th><th class="r hide-sm">Games</th></tr></thead>`;
    const leader = ladder[0];
    const sideList = (m, radiant) => m.changes.filter(c => c.radiant === radiant).map(c => `
      <li><span>${heroChip(c.hero_id)}${esc(c.name)}${c.id == null ? ' <span class="g">guest</span>' : ''}</span>
      <span class="num ${c.delta > 0 ? 'delta-up' : c.delta < 0 ? 'delta-down' : 'g'}">${c.delta == null ? '' : signed(c.delta)}</span></li>`).join('');
    const cards = matches.map(m => `
      <article class="matchcard">
        <header><span>${fmtDateTime(m.start_time)} · ${Math.round(m.duration / 60)} min</span><a href="https://www.opendota.com/matches/${m.match_id}" target="_blank" rel="noopener">Match ${m.match_id}</a></header>
        <div class="sides">
          <div class="side radiant"><h4>Radiant ${m.radiant_win ? 'victory' : 'defeat'}<span class="avg num">avg ${m.radAvg}</span></h4><ul>${sideList(m, true)}</ul></div>
          <div class="side dire"><h4>Dire ${m.radiant_win ? 'defeat' : 'victory'}<span class="avg num">avg ${m.direAvg}</span></h4><ul>${sideList(m, false)}</ul></div>
        </div>
      </article>`).join('');

    $('#view-league').innerHTML = `
      <div class="hero">
        <div class="crest" aria-hidden="true">${leader ? leader.rating : ''}</div>
        ${leader ? avaImg(leader.id, 'champ') : ''}
        <div class="eyebrow">${esc(CFG.season.name)} · League ladder</div>
        <h1 class="${leader && leader.name.length > 22 ? 'long' : ''}">${leader ? esc(leader.name) : 'The ladder awaits'}</h1>
        <p class="tagline">${leader ? `Tops the ladder at <span class="pts num">${leader.rating}</span> ELO` : 'It opens after the first lobby night.'}</p>
        <p class="sub">ELO from community lobby matches only. Everyone starts at ${CFG.elo.start}; you need ${CFG.elo.minGamesForLadder} games to be ranked.</p>
      </div>
      ${ladder.length ? `<div class="section-head"><div><div class="eyebrow">Ranked</div><h2>Ladder</h2></div></div><table class="table">${head}<tbody>${ladder.map(row).join('')}</tbody></table>` : ''}
      ${provisional.length ? `<div class="section-head"><div><div class="eyebrow">Fewer than ${CFG.elo.minGamesForLadder} league games</div><h2>Provisional</h2></div></div><table class="table">${head}<tbody>${provisional.map(row).join('')}</tbody></table>` : ''}
      ${!ladder.length && !provisional.length ? `<div class="empty" style="margin-top:40px"><strong>No league matches recorded yet</strong> After a lobby night, add each match ID to <code>leagueMatches</code> in config.js.</div>` : ''}
      ${matches.length ? `<div class="section-head"><div><div class="eyebrow">Lobby nights</div><h2>Match history</h2></div></div>${cards}` : ''}`;
  }

  function renderSeason() {
    const { weeks, rows } = S.seasonTable(state.members, state.scored, CFG);
    const thisWeek = S.weekStartDay(state.now, TZ);
    const max = Math.max(1, ...rows.flatMap(r => r.perWeek));
    const leader = rows[0] && rows[0].total ? rows[0] : null;
    const top = leader ? rows.filter(r => r.total === leader.total) : [];
    const started = thisWeek >= weeks[0];
    $('#view-season').innerHTML = `
      <div class="hero">
        <div class="crest" aria-hidden="true">${toRoman(Number((CFG.season.name.match(/\d+/) || [1])[0]))}</div>
        ${leader ? avaImg(leader.id, 'champ') : ''}
        <div class="eyebrow">${esc(CFG.season.name)} · ${weekLabel(weeks[0]).split(' – ')[0]} to ${weekLabel(weeks[weeks.length - 1]).split(' – ')[1]}</div>
        <h1 class="${leader && (top.length > 1 ? joinNames(top) : leader.name).length > 22 ? 'long' : ''}">${leader ? esc(top.length > 1 ? joinNames(top) : leader.name) : started ? 'The race is on' : esc(CFG.season.name)}</h1>
        <p class="tagline">${leader ? `${top.length > 1 ? `Share the ${seasonTitle} lead` : `${seasonTitle} so far`} with <span class="pts num">${leader.total}</span> points` : started ? 'No season points yet.' : `Starts ${fmtDay(S.dayToTs(weeks[0], TZ))}.`}</p>
        <p class="sub">${guildsOn ? `Season MVP goes to the most Weekly Points across all ${weeks.length} weeks. Season Champion is the guild with the best Fight Night record.` : `Total Weekly Points across all ${weeks.length} weeks of the season.`}</p>
      </div>
      ${guildsOn ? seasonGuildBlock() : ''}
      <div class="section-head"><div><div class="eyebrow">Weeks 1 to ${weeks.length}</div><h2>${guildsOn ? 'Season MVP race' : 'Season totals'}</h2></div></div>
      <table class="table">
        <thead><tr><th>#</th><th>Player</th><th class="r">Total</th><th class="hide-sm">Weeks 1–${weeks.length}</th></tr></thead>
        <tbody>${rows.map(r => `
          <tr>
            <td class="rank num ${r.total && r.rank <= 3 ? 'top' : ''}">${r.total ? r.rank : '–'}</td>
            <td><span class="cell-player">${avaImg(r.id, 'ava-sm')}<span class="name">${esc(r.name)}</span></span></td>
            <td class="r points num">${r.total}</td>
            <td class="hide-sm"><span class="bars" role="img" aria-label="${r.perWeek.join(', ')} points by week">${r.perWeek.map((v, i) =>
              `<i class="${v ? '' : 'zero'}" style="height:${weeks[i] > thisWeek ? 2 : Math.max(2, Math.round(v / max * 26))}px;${weeks[i] > thisWeek ? 'opacity:.25' : ''}"></i>`).join('')}</span></td>
          </tr>`).join('')}</tbody>
      </table>`;

  // ---------- join: players link their own Dota account ----------
  async function lookupAccount(id) {
    if (CFG.demo) {
      await new Promise(r => setTimeout(r, 350));
      return { id, known: true, name: `Player ${String(id).slice(-3)}`, avatar: null, total: 480, lastGame: state.now - 5 * 3600, taken: state.members.some(m => m.id === id) };
    }
    const prof = await od(`/players/${id}`);
    if (!prof || !prof.profile) return { id, known: false };
    const wl = await od(`/players/${id}/wl?significant=0`);
    const recent = await od(`/players/${id}/matches?limit=1&significant=0`);
    return { id, known: true, name: prof.profile.personaname || 'Player', avatar: prof.profile.avatarmedium || null,
      total: (wl.win || 0) + (wl.lose || 0), lastGame: recent.length ? recent[0].start_time : null,
      taken: state.members.some(m => m.id === id && (m.discordId || m.linked)) };
  }

  function lookChecks(L) {
    const min = CFG.registration.minTotalMatches;
    return [
      [!!L.lastGame, L.lastGame ? `Match data is public (last game ${fmtDateTime(L.lastGame)})` : 'No visible matches. Turn on Expose Public Match Data in Dota 2 (Settings › Options › Social), play one game, then try again.'],
      [L.total >= min, `${L.total} total matches (needs ${min})`],
      [!L.taken, L.taken ? 'Already linked to another player. If it\'s yours, ask an admin on Discord.' : 'Not linked to anyone yet'],
    ];
  }

  function wireJoin() {
    const view = $('#view-register'), R = state.reg;
    const f = $('#regForm');
    if (f) f.onsubmit = async ev => {
      ev.preventDefault();
      R.input = $('#regInput').value; R.msg = ''; R.name = null;
      const id = toAccountId(R.input);
      if (!id || id >= 4294967296) { R.look = { error: "That isn't a Friend ID or a profile link with the number in it. Custom Steam /id/ links can't be read; use the number on your Dota profile." }; return renderJoin(); }
      R.look = { id, busy: true }; renderJoin();
      try { R.look = await lookupAccount(id); }
      catch { R.look = { id, error: "OpenDota didn't respond. Wait a minute and try again." }; }
      renderJoin();
    };
    view.onclick = async ev => {
      const b = ev.target.closest('[data-reg]'); if (!b) return;
      const act = b.dataset.reg;
      if (act === 'login') { store.set('returnTo', 'register'); await state.sb.auth.signInWithOAuth({ provider: 'discord', options: { redirectTo: location.origin + location.pathname } }); return; }
      if (act === 'logout') { await state.sb.auth.signOut(); state.session = null; R.look = null; renderAll(); return; }
      if (act === 'reset' || act === 'again') { R.look = null; R.input = ''; R.msg = ''; R.name = null; if (act === 'again') R.linked = null; renderJoin(); const i = $('#regInput'); if (i) i.focus(); return; }
      if (act === 'link') {
        const L = R.look, name = $('#regName').value.trim(); R.name = name;
        const say = (m, ok) => { R.msg = m; R.msgOk = !!ok; const el = $('#regMsg'); if (el) { el.textContent = m; el.className = 'link-msg ' + (ok ? 'ok' : 'bad'); } };
        if (!name) return say('Pick a name for the leaderboards.');
        if (tauntBlocked(name)) return say("That name isn't allowed. Pick another.");
        if (CFG.demo) {
          state.members.push({ id: L.id, name, discord: '', discordId: 'demo-new-' + L.id, linked: true, linkedAt: new Date().toISOString() });
          state.raw[L.id] = []; recompute();
          R.linked = L.id; R.look = null; R.input = ''; R.msg = ''; R.name = null;
          return renderAll();
        }
        b.disabled = true; say('Linking…', true);
        const { error } = await state.sb.rpc('link_player', { p_account: L.id, p_name: name });
        if (error) { b.disabled = false; return say(error.message || "Couldn't link right now. Try again."); }
        say('Linked. Loading your games…', true);
        await loadRoster(); await loadMissing(); recompute();
        R.look = null; R.input = ''; R.msg = ''; R.name = null;
        renderAll();
      }
    };
  }

      const act = b.dataset.adm;

      if (act === 'copy') { try { await navigator.clipboard.writeText(b.dataset.text); $('#admCopy').textContent = 'Copied.'; } catch { $('#admCopy').textContent = 'Select the line above to copy it.'; } return; }
      if (act === 'unlink') {
        if (!confirmLike(b)) return;
        const id = Number(b.dataset.id), m = memberById(id), name = m ? m.name : 'Player';
        if (CFG.demo) {
          state.members = state.members.filter(x => x.id !== id); delete state.raw[id]; recompute();
          if (state.reg.linked === id) state.reg.linked = null;
          AD.msg = `${name} is unlinked.`; AD.msgOk = true; return renderAll();
        }
        b.disabled = true;
        const { error } = await state.sb.rpc('admin_unlink', { p_discord: b.dataset.d });
        if (error) { AD.msg = error.message || "Couldn't unlink right now."; AD.msgOk = false; b.disabled = false; return renderAdmin(); }
        await loadRoster(); recompute();
        AD.msg = `${name} is unlinked. Friend ID ${id} can be linked again.`; AD.msgOk = true;
        renderAll();
      }
    };
  }

  function toAccountId(input) {
    const s = String(input || '').trim();
    const m = s.match(/(\d{5,20})/);
    if (!m) return null;
    const n = BigInt(m[1]);
    const base = 76561197960265728n;
    return Number(n > base ? n - base : n);
  }

  // ---------- avatars ----------
  const memberById = id => state.members.find(m => m.id === Number(id));
  const avatarKey = m => (!m ? null : CFG.demo ? 'demo:' + m.id : m.discordId ? String(m.discordId) : null);
  function loadoutOf(id) {
    const m = memberById(id), key = avatarKey(m);
    return A.sanitize(key ? state.avatars[key] : null, id, state.stats[id]);
  }
  // Every avatar is animated: idle breathing by default, or a taunt pose sequence.
  const animAttr = (lo, anim) => ` data-lo="${esc(JSON.stringify(lo))}"${anim && anim !== 'none' ? ` data-anim="${anim}"` : ''}`;
  const avaImg = (id, cls, anim) => { if (!FEAT.avatars) return ''; const lo = loadoutOf(id); const a = anim && anim !== 'none' ? anim : 'idle'; return `<img class="ava ${cls}" src="${A.toDataURL(lo, 0, a)}"${animAttr(lo, anim)} alt="">`; };
  const rarityOf = it => A.RARITY[it.rarity] || A.RARITY.starter;

  // ---------- taunts ----------
  const TCFG = Object.assign({ maxLength: 40, blockedWords: [] }, CFG.taunts || {});
  const TAUNTS = [
    { id: 'none', name: 'Idle' }, { id: 'hop', name: 'Victory Hop' }, { id: 'spin', name: 'Hero Spin' },
    { id: 'combo', name: 'Combo Strike' }, { id: 'dash', name: 'Dash Flash' }, { id: 'run', name: 'Gank Run' },
    { id: 'buyback', name: 'Buyback' }, { id: 'shake', name: 'Tilt Shake' }, { id: 'flex', name: 'Power Flex' },
  ];
  const cleanTaunt = t => Array.from(String(t || '').replace(/[\u0000-\u001f\u007f\u200b-\u200f\u202a-\u202e\u2066-\u2069]/g, ' ').replace(/\s+/g, ' ').trim()).slice(0, TCFG.maxLength).join('');
  // Slur and abuse filter: open-source word list plus disguise handling, plus the league's own blocked words.
  // If the word list can't load, every taunt counts as blocked, so nothing unchecked is ever shown.
  const FILTER = window.TauntFilter ? window.TauntFilter.create(window.Obscenity, { blockedWords: TCFG.blockedWords, allowedWords: TCFG.allowedWords }) : null;
  const tauntBlocked = t => (FILTER ? FILTER.isBlocked(t) : !!String(t || '').trim());
  const validAnim = a => (TAUNTS.some(t => t.id === a) ? a : 'none');
  function tauntOf(id) {
    if (!FEAT.avatars) return { text: '', anim: 'none' };
    const raw = state.avatars[avatarKey(memberById(id))] || {};
    const text = cleanTaunt(raw.taunt);
    return { text: text && !tauntBlocked(text) ? text : '', anim: validAnim(raw.tauntAnim) };
  }
  function podiumAvatar(id) { const t = tauntOf(id); return avaImg(id, 'ava-pod', t.anim); }
  function podiumBubble(id) { const t = tauntOf(id); return t.text ? `<div class="bubble pod-bubble">${esc(t.text)}</div>` : ''; }
  function champTaunt(id) { const t = tauntOf(id); return `<div class="champ-wrap">${t.text ? `<div class="bubble">${esc(t.text)}</div>` : ''}${avaImg(id, 'champ', t.anim)}</div>`; }
  function iconTile(slot, it, lo, extra = '') {
    const url = A.iconURL(slot, it.id, 0, lo), r = rarityOf(it);
    return `<span class="slot-ic r-${it.rarity} ${extra}" style="--rc:${r.color}">${url ? `<img src="${url}"${it.animated ? ` data-icon="${slot}|${it.id}"` : ''} alt="">` : ''}</span>`;
  }
  // One clock drives every avatar frame by frame (skipped for reduced motion).
  // Avatars each start at a different point in their idle loop so a table doesn't breathe in unison.
  (function animate() {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    let tick = 0;
    setInterval(() => {
      tick++;
      document.querySelectorAll('img[data-lo]').forEach((i, n) => {
        if (!i.offsetParent) return;                       // skip avatars on hidden pages
        try {
          if (!i._lo || i._loSrc !== i.dataset.lo) { i._lo = JSON.parse(i.dataset.lo); i._loSrc = i.dataset.lo; i._phase = (n * 5) % A.IDLE_LEN; }
          const anim = i.dataset.anim || 'idle';
          i.src = A.toDataURL(i._lo, anim === 'idle' ? tick + i._phase : tick, anim);
        } catch {}
      });
      if (tick % 2 === 0) document.querySelectorAll('img[data-icon]').forEach(i => { if (!i.offsetParent) return; const [sl, id] = i.dataset.icon.split('|'); const u = A.iconURL(sl, id, (tick >> 1) & 3); if (u) i.src = u; });
    }, 150);
  })();

  function loadScript(src) {
    return new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); });
  }

  async function initLogin() {
    if (!loginEnabled) return;
    await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js');
    state.sb = window.supabase.createClient(AV.supabaseUrl, AV.supabaseAnonKey, { auth: { flowType: 'pkce', detectSessionInUrl: true, persistSession: true } });
    const { data } = await state.sb.auth.getSession();
    state.session = data.session;
    state.sb.auth.onAuthStateChange((_event, session) => { const changed = (state.session && state.session.user && state.session.user.id) !== (session && session.user && session.user.id); state.session = session; if (changed) { state.admin.isAdmin = null; checkAdmin(); } if (!state.loading) { if (FEAT.avatars) renderAvatar(); renderRegister(); renderAdmin(); if (guildsOn) loadGuilds().then(renderGuildViews, () => {}); } });
    if (location.search.includes('code=')) history.replaceState(null, '', location.pathname + location.hash);
    if (state.session && store.get('returnToAvatar')) { store.set('returnToAvatar', null); location.hash = 'avatar'; }
    if (state.session && store.get('returnTo')) { const r = store.get('returnTo'); store.set('returnTo', null); location.hash = r; }
    checkAdmin();
  }

  async function loadAvatars() {
    if (!state.sb) return;
    const { data, error } = await state.sb.from('avatars').select('discord_id, loadout');
    if (error) { state.errors.push('Saved avatars could not load; showing default gear.'); return; }
    state.avatars = Object.fromEntries(data.map(r => [r.discord_id, r.loadout]));
  }

  function discordName() {
    const m = (state.session && state.session.user && state.session.user.user_metadata) || {};
    return (m.custom_claims && m.custom_claims.global_name) || m.full_name || m.name || m.user_name || 'your account';
  }

  function myDiscordId() {
    const u = state.session && state.session.user;
    if (!u) return null;
    const idn = (u.identities || []).find(i => i.provider === 'discord');
    return String((idn && ((idn.identity_data && idn.identity_data.provider_id) || idn.id)) || (u.user_metadata && u.user_metadata.provider_id) || '') || null;
  }

  function lockerPlayer() {
    if (CFG.demo) {
      if (state.locker.playerId == null && state.members.length) state.locker.playerId = state.members[0].id;
      return memberById(state.locker.playerId);
    }
    const did = myDiscordId();
    return did ? state.members.find(m => String(m.discordId || '') === did) : null;
  }

  function renderAvatar() {

    }

    }
    const me = lockerPlayer();
    if (!me) {
      const did = myDiscordId();
      view.innerHTML = hero + `<div class="gate"><h2>One more step: link your Dota account</h2>
        <p>Enter your Dota Friend ID once so we can find your games and unlock your gear.</p>
        <div class="acts"><a class="btn-red" href="#register">Link my Dota account</a><button class="btn" data-act="logout">Log out</button></div></div>`;
      return wireAvatar(did);
    }
    const L = state.locker;
    if (!L.draft || L.draftFor !== me.id) {
      const raw = state.avatars[avatarKey(me)] || {};
      L.draft = { ...loadoutOf(me.id), taunt: cleanTaunt(raw.taunt), tauntAnim: validAnim(raw.tauntAnim) };
      L.draftFor = me.id; L.msg = '';
    }
    const st = state.stats[me.id];
    const draft = A.sanitize(L.draft, me.id, st);
    const all = A.SLOTS.flatMap(s => s.items.filter(i => !i.free));
    const owned = all.filter(i => A.isUnlocked(i, st)).length;
    const next = A.nextUnlock(st);
    const val = next ? (st[next.item.stat] || 0) : 0;

    const tabs = [['look', 'Look', '']].concat(A.SLOTS.map(sl => [sl.id, sl.name, `${sl.items.filter(i => A.isUnlocked(i, st)).length}/${sl.items.length}`]), [['taunt', 'Taunt', '']]);
    const dT = { text: L.draft.taunt || '', anim: validAnim(L.draft.tauntAnim) };
    let panel;
    if (L.tab === 'look') {
      const sw = (key, list) => list.map((c, i) => `<button class="swatch" style="background:${c}" data-act="look" data-key="${key}" data-val="${i}" aria-pressed="${draft[key] === i}" aria-label="${key} ${i + 1}"></button>`).join('');
      panel = `<div class="look">

        <h3>Hair</h3><div class="items" style="margin-bottom:24px">${A.HAIR_STYLES.map(h => `
          <button class="item ${draft.hair === h.id ? 'equipped' : ''}" data-act="look" data-key="hair" data-val="${h.id}">
            <img src="${A.toDataURL({ ...draft, hair: h.id, head: 'none' })}" alt=""><div class="iname">${h.name}</div></button>`).join('')}</div>
        <h3>Hair colour</h3><div class="swatches">${sw('hairColor', A.HAIR_COLORS)}</div>
        <h3>Tunic colour</h3><div class="swatches">${sw('tunic', A.TUNICS)}</div>
      </div>`;
    } else if (L.tab === 'taunt') {
      const len = Array.from(dT.text).length;
      panel = `<div class="taunt-panel">
        <p class="lead">Your taunt plays on the Weekly page whenever you finish in the top 3. The week's leader gets the big spotlight at the top of the page.</p>
        <h3>Animation</h3>
        <div class="items" style="margin-bottom:24px">${TAUNTS.map(t => `
          <button class="item ${dT.anim === t.id ? 'equipped' : ''}" data-act="taunt-anim" data-val="${t.id}">
            <span class="slot-ic big" style="--rc:rgba(232,85,62,.6)"><img src="${A.toDataURL(draft, 0, t.id === 'none' ? 'idle' : t.id)}"${animAttr(draft, t.id)} alt=""></span>
            <div class="iname">${t.name}</div></button>`).join('')}</div>
        <h3>Taunt line</h3>
        <div class="form" style="margin-top:6px">
          <label for="tauntInput" class="sr-only">Taunt line</label>

          <span id="tauntCount" class="count ${len >= TCFG.maxLength ? 'full' : ''}">${len}/${TCFG.maxLength}</span>
        </div>
        <p id="tauntWarn" class="taunt-warn" role="alert" ${tauntBlocked(dT.text) && dT.text ? '' : 'hidden'}>${FILTER && FILTER.ready ? "That line isn't allowed. Slurs and abuse are blocked; try some friendly trash talk instead." : "Taunts can't be checked right now, so they're switched off. Try again later."}</p>
        <p class="lead" style="font-size:14px">Keep it banter. Slurs and abusive words are blocked, including disguised spellings, and admins can block more.</p>
      </div>`;
    } else {
      const slot = A.SLOTS.find(sl => sl.id === L.tab);
      panel = `<div class="items">${slot.items.map(it => {
        const open = A.isUnlocked(it, st);
        const v = it.free ? 0 : (st[it.stat] || 0);
        const r = rarityOf(it);
        return `<button class="item ${open ? '' : 'locked'} ${draft[slot.id] === it.id ? 'equipped' : ''}" style="--rc:${r.color}" ${open ? `data-act="equip" data-slot="${slot.id}" data-val="${it.id}"` : 'aria-disabled="true"'}>

          <div class="rar">${r.name}</div>

          ${guildsOn && it.id !== 'none' ? `<div class="ibattle"><b>In battle:</b> ${esc([B.slotStatText(slot.id, it.rarity), B.itemBattleText(it.id)].filter(Boolean).join('. ') || 'Base stats')}</div>` : ''}
          ${open ? '' : `<div class="bar"><i style="width:${Math.round(A.progress(it, st) * 100)}%"></i></div>`}
        </button>`; }).join('')}</div>`;

    view.innerHTML = hero + `
      <div class="locker">
