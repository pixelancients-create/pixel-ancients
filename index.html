          <div class="stage-wrap">
            <div class="bubble" id="stageBubble" ${dT.text && !tauntBlocked(dT.text) ? '' : 'hidden'}>${tauntBlocked(dT.text) ? '' : esc(dT.text)}</div>
            <img class="stage-ava" src="${A.toDataURL(draft, 0, dT.anim === 'none' ? 'idle' : dT.anim)}"${animAttr(draft, dT.anim)} alt="${esc(me.name)}'s avatar">
          </div>
          <div class="build" aria-label="Equipped gear">${A.SLOTS.map(sl => { const it = A.findItem(sl.id, draft[sl.id]); return it && it.id !== 'none' ? `<span title="${esc(it.name)} (${rarityOf(it).name})">${iconTile(sl.id, it, draft)}</span>` : `<span title="${sl.name}: empty"><span class="slot-ic empty"></span></span>`; }).join('')}</div>
          <div class="who">${esc(me.name)}</div>
          <div class="count">${owned} of ${all.length} items unlocked</div>
          ${guildsOn ? `<div class="power-chip" title="Gear power, used to pair guilds on Fight Night">⚔ ${B.avatarPower(draft)} battle power</div>` : ''}
          ${next ? `<div class="next"><div class="eyebrow" style="font-size:11px">Next unlock</div><b>${esc(next.item.name)}</b>: ${esc(A.requirement(next.item))} (${bigNum(Math.min(val, next.item.need))}/${bigNum(next.item.need)})<div class="bar"><i style="width:${Math.round(next.p * 100)}%"></i></div></div>` : `<div class="next">Every item unlocked. Legend.</div>`}
          <div class="actions">
            <button class="btn-red" data-act="save">Save avatar</button>
            <button class="btn" data-act="best">Wear my best gear</button>
            ${CFG.demo ? '' : '<button class="btn" data-act="logout">Log out</button>'}
            <span id="saveMsg" role="status" style="color:var(--muted);font-size:14px">${esc(L.msg)}</span>
          </div>
        </aside>
        <div>
          <div class="slot-tabs" role="tablist">${tabs.map(([id, name, n]) => `<button role="tab" aria-selected="${L.tab === id}" data-act="tab" data-val="${id}">${name}${n ? `<span class="n">${n}</span>` : ''}</button>`).join('')}</div>
          ${panel}
        </div>
      </div>`;
    wireAvatar();
  }

  function wireAvatar(did) {
    const view = $('#view-avatar'), L = state.locker;
    const pick = $('#demoPick');
    if (pick) pick.onchange = () => { L.playerId = Number(pick.value); L.draft = null; renderAvatar(); };
    const ti = $('#tauntInput');
    if (ti) ti.oninput = () => {
      const v = Array.from(ti.value).slice(0, TCFG.maxLength).join('');
      L.draft = { ...L.draft, taunt: v }; L.msg = '';
      const n = Array.from(v).length, c = $('#tauntCount'), sb = $('#stageBubble');
      c.textContent = `${n}/${TCFG.maxLength}`; c.classList.toggle('full', n >= TCFG.maxLength);
      const bad = tauntBlocked(v), w = $('#tauntWarn');
      sb.textContent = bad ? '' : v.trim(); sb.hidden = bad || !v.trim();
      w.hidden = !bad; ti.setAttribute('aria-invalid', bad ? 'true' : 'false');
    };
    view.onclick = async ev => {
      const b = ev.target.closest('[data-act]');
      if (!b || !view.contains(b)) return;
      const act = b.dataset.act, me = lockerPlayer();
      if (act === 'login') { store.set('returnToAvatar', 1); await state.sb.auth.signInWithOAuth({ provider: 'discord', options: { redirectTo: location.origin + location.pathname } }); return; }
      if (act === 'logout') { await state.sb.auth.signOut(); state.session = null; L.draft = null; renderAvatar(); return; }
      if (act === 'copy-id') { try { await navigator.clipboard.writeText(did || ''); $('#idMsg').textContent = 'Copied.'; } catch { $('#idMsg').textContent = 'Select the ID above to copy it.'; } return; }
      if (act === 'tab') { L.tab = b.dataset.val; renderAvatar(); return; }
      if (act === 'taunt-anim') { L.draft = { ...L.draft, tauntAnim: validAnim(b.dataset.val) }; L.msg = ''; renderAvatar(); return; }
      if (act === 'look') { const k = b.dataset.key; L.draft = { ...L.draft, [k]: k === 'hair' ? b.dataset.val : Number(b.dataset.val) }; L.msg = ''; renderAvatar(); return; }
      if (act === 'equip') { L.draft = { ...L.draft, [b.dataset.slot]: b.dataset.val }; L.msg = ''; renderAvatar(); return; }
      if (act === 'best') { const prev = L.draft || {}; const d = A.defaultLoadout(me.id, state.stats[me.id]); ['skin', 'hair', 'hairColor', 'tunic', 'taunt', 'tauntAnim'].forEach(k => { if (prev[k] != null) d[k] = prev[k]; }); L.draft = d; L.msg = ''; renderAvatar(); return; }
      if (act === 'save') {
        const taunt = cleanTaunt(L.draft.taunt);
        if (taunt && tauntBlocked(taunt)) { L.msg = "That taunt isn't allowed. Change the line, or clear it, to save."; renderAvatar(); return; }
        const lo = { ...A.sanitize(L.draft, me.id, state.stats[me.id]), taunt, tauntAnim: validAnim(L.draft.tauntAnim) };
        if (CFG.demo) { state.avatars[avatarKey(me)] = lo; L.msg = 'Saved for this visit (sample data isn\'t stored).'; renderAll(); return; }
        b.disabled = true; $('#saveMsg').textContent = 'Saving…';
        const { error } = await state.sb.from('avatars').upsert({ discord_id: myDiscordId(), loadout: lo, updated_at: new Date().toISOString() });
        if (error) { L.msg = 'Couldn\'t save. Try logging out and in again.'; b.disabled = false; $('#saveMsg').textContent = L.msg; return; }
        state.avatars[myDiscordId()] = lo; L.msg = 'Saved. Your new look is live on the leaderboards.';
        renderAll();
      }
    };
  }

  function unlockList() {
    const base = { skin: 1, hair: 'short', hairColor: 1, tunic: 0, head: 'none', body: 'tunic', cape: 'none', weapon: 'training_sword', pet: 'none', aura: 'none' };
    return `<h2>Gear to unlock</h2><ul class="unlock-list">${A.SLOTS.flatMap(sl => sl.items.filter(i => !i.free).map(it =>
      `<li>${iconTile(sl.id, it, base)}<span><b>${esc(it.name)}</b> <span class="rar" style="color:${rarityOf(it).color}">${rarityOf(it).name}</span><br><span class="r">${esc(A.requirement(it))}</span></span></li>`)).join('')}</ul>`;
  }

  // Gear each player unlocked during a week: stats at the week's start vs its end (or now).
  const RARITY_ORDER = ['unique', 'legendary', 'epic', 'rare', 'common'];
  function weeklyUnlocks(week) {
    if (!FEAT.avatars || !state.members.length) return [];
    const { start, end } = S.weekRange(week, TZ);
    if (start >= state.now) return [];
    const before = A.computeStats(state.members, state.scored, state.elo, CFG, start);
    const after = A.computeStats(state.members, state.scored, state.elo, CFG, Math.min(end, state.now + 1));
    const out = [];
    for (const m of state.members) for (const sl of A.SLOTS) for (const it of sl.items) {
      if (!it.free && !A.isUnlocked(it, before[m.id]) && A.isUnlocked(it, after[m.id])) out.push({ m, slot: sl.id, it });
    }
    return out.sort((a, b) => RARITY_ORDER.indexOf(a.it.rarity) - RARITY_ORDER.indexOf(b.it.rarity) || a.m.name.localeCompare(b.m.name));
  }
  function lootStrip(unlocks, isCurrent) {
    if (!unlocks.length) return '';
    const show = unlocks.slice(0, 12);
    return `<div class="section-head"><div><div class="eyebrow">${isCurrent ? 'Unlocked so far this week' : 'Unlocked that week'}</div><h2>New gear</h2></div></div>
      <div class="loot">${show.map(u => { const r = rarityOf(u.it); return `<div class="loot-card" style="--rc:${r.color}">${iconTile(u.slot, u.it, null)}<div><div class="rar">${r.name}</div><div class="iname">${esc(u.it.name)}</div><div class="who">${esc(u.m.name)}</div></div></div>`; }).join('')}</div>
      ${unlocks.length > show.length ? `<p class="lead" style="margin-top:10px">+${unlocks.length - show.length} more unlocks</p>` : ''}`;
  }

  // ---------- landing page ----------
  const SHOWCASE = [
    { lo: { skin: 3, hair: 'spiky', hairColor: 0, tunic: 2, head: 'rampage_helm', body: 'offlane_plate', cape: 'dire_banner', weapon: 'dusk_sabre', pet: 'none', aura: 'none' }, anim: 'combo', line: 'Three hits. One combo.' },
    { lo: { skin: 1, hair: 'short', hairColor: 3, tunic: 1, head: 'midlane_mask', body: 'tunic', cape: 'gank_cloak', weapon: 'twin_hatchets', pet: 'none', aura: 'none' }, anim: 'dash', line: '' },
    { lo: { skin: 2, hair: 'long', hairColor: 2, tunic: 3, head: 'weekly_crown', body: 'champion_mail', cape: 'sunfire_cape', weapon: 'starforged_spear', pet: 'ember_drake', aura: 'godlike' }, anim: 'hop', line: 'See you on the high ground.' },
    { lo: { skin: 0, hair: 'mohawk', hairColor: 3, tunic: 4, head: 'pathfinder_goggles', body: 'weekend_vest', cape: 'none', weapon: 'lasthit_dagger', pet: 'slime_buddy', aura: 'none' }, anim: 'run', line: '' },
    { lo: { skin: 2, hair: 'short', hairColor: 4, tunic: 0, head: 'tower_helm', body: 'jungler_leathers', cape: 'radiant_banner', weapon: 'throne_breaker', pet: 'none', aura: 'none' }, anim: 'buyback', line: 'GG. Try again Monday.' },
  ];
  // stage positions: left %, size px, layer
  const STAGE = [[-1, 24, 1], [15, 27, 2], [31, 38, 3], [58, 27, 2], [77, 24, 1]];   // left %, width %, layer

  // ===================== Guilds & Fight Night =====================
  const B = window.LeagueBattle;
  const GCFG = Object.assign({ fightDays: [6, 0], fightHour: 21, minMembers: 3, underdog: 0.75, switchCooldown: true }, CFG.guilds || {});
  const guildsOn = !!(FEAT.guilds && FEAT.avatars && B && window.LeagueArena);
  const DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const fmtHour = h => `${((h + 11) % 12) + 1}${h < 12 ? 'am' : 'pm'}`;
  const fightWhen = `${GCFG.fightDays.map(d => DAY_NAMES[d]).join(' and ')} at ${fmtHour(GCFG.fightHour)}`;

  // ---- pixel crests ----
  const CREST_COLORS = ['#c23c2a', '#2f6b9a', '#4f8a2e', '#7a4bb3', '#d8a33a', '#2f9a92', '#3a3f47', '#e8e2d4'];
  const CREST_SYMBOLS = [
    ['...#...', '...#...', '...#...', '...#...', '.#####.', '...#...', '...#...'],      // sword
    ['...#...', '..###..', '#######', '.#####.', '..###..', '.##.##.', '##...##'],      // star
    ['...#...', '..##...', '..###..', '.####.#', '.######', '#######', '.#####.'],      // flame
    ['#..#..#', '##.#.##', '#######', '#######', '.#####.', '.......', '.......'],      // crown
    ['..###..', '.##....', '##.....', '##.....', '##.....', '.##....', '..###..'],      // moon
    ['...#...', '..###..', '.#####.', '..###..', '.#####.', '#######', '...#...'],      // tree
    ['....##.', '...##..', '..##...', '.#####.', '...##..', '..##...', '.##....'],      // bolt
    ['.......', '.##..##', '#..##..', '.......', '.##..##', '#..##..', '.......'],      // wave
    ['...#...', '..###..', '.#####.', '.#####.', '.#####.', '..###..', '...#...'],      // crystal
  ];
  const CREST_NAMES = ['Sword', 'Star', 'Flame', 'Crown', 'Moon', 'Tree', 'Bolt', 'Wave', 'Crystal'];
  const crestCache = new Map();
  function cleanCrest(c) {
    const n = (v, max) => (Number.isInteger(v) && v >= 0 && v < max ? v : 0);
    c = c || {};
    return { s: n(c.s, CREST_SYMBOLS.length), b: n(c.b, CREST_COLORS.length), f: n(c.f, CREST_COLORS.length) };
  }
  function crestURL(raw) {
    const c = cleanCrest(raw), key = `${c.s}|${c.b}|${c.f}`;
    if (crestCache.has(key)) return crestCache.get(key);
    const cv = document.createElement('canvas'); cv.width = 16; cv.height = 16;
    const ctx = cv.getContext('2d');
    const bg = CREST_COLORS[c.b], fg = c.f === c.b ? (c.b === 7 ? CREST_COLORS[6] : CREST_COLORS[7]) : CREST_COLORS[c.f];
    for (let y = 1; y < 15; y++) {
      const inset = y < 9 ? 0 : y - 8, x0 = 2 + inset, x1 = 13 - inset;
      for (let x = x0; x <= x1; x++) {
        const edge = x === x0 || x === x1 || y === 1 || y === 14 || (y >= 9 && (x === x0 || x === x1));
        ctx.fillStyle = edge ? '#160d0a' : (x === x0 + 1 || y === 2) ? 'rgba(255,255,255,0.18)' : bg;
        if (!edge && (x === x0 + 1 || y === 2)) { ctx.fillStyle = bg; ctx.fillRect(x, y, 1, 1); ctx.fillStyle = 'rgba(255,255,255,0.18)'; }
        ctx.fillRect(x, y, 1, 1);
      }
    }
    CREST_SYMBOLS[c.s].forEach((row, y) => [...row].forEach((ch, x) => { if (ch === '#') { ctx.fillStyle = fg; ctx.fillRect(4 + x, 4 + y, 1, 1); } }));
    const url = cv.toDataURL('image/png');
    crestCache.set(key, url);
    return url;
  }
  const crestImg = (c, size = 32) => `<img class="crest-img" src="${crestURL(c)}" width="${size}" height="${size}" alt="">`;

  // ---- names: guild names and tags go through the same slur filter as taunts ----
  const guildName = g => (!g ? 'Unknown guild' : tauntBlocked(g.name) ? 'Guild (name hidden)' : g.name);
  const guildTag = g => (!g || tauntBlocked(g.tag) ? '???' : String(g.tag).toUpperCase());
  const memberByDiscord = d => state.members.find(m => avatarKey(m) === String(d));
  const playerName = d => { const m = memberByDiscord(d); return m ? m.name : 'Unlinked player'; };
  const meDid = () => (CFG.demo ? (lockerPlayer() ? avatarKey(lockerPlayer()) : null) : myDiscordId());
  const myGuild = () => { const d = meDid(); return d ? state.guilds.find(g => g.members.some(m => m.discord_id === d)) : null; };
  const isCaptain = g => !!g && g.captain === meDid();
  const guildPower = g => B.teamPower({ members: g.members.slice(0, 5).map(m => { const p = memberByDiscord(m.discord_id); return { lo: p ? loadoutOf(p.id) : A.defaultLoadout(0, null) }; }) });

  // ---- data ----
  async function loadGuilds() {
    state.guilds = []; state.snaps = []; state.gReq = []; state.invite = null; state.fights = []; state.fightSnaps = {};
    if (!guildsOn) return;
    if (CFG.demo) {
      if (!state.demoGuilds) { const d = window.LEAGUE_DEMO.generate(CFG); state.demoGuilds = { guilds: d.guilds, invites: d.invites, snaps: d.snapshots, req: [] }; }
      state.guilds = state.demoGuilds.guilds; state.snaps = state.demoGuilds.snaps; state.gReq = state.demoGuilds.req;
      const g = myGuild(); state.invite = g && isCaptain(g) ? state.demoGuilds.invites[g.id] : null;
    } else if (state.sb) {
      const [g, m, f] = await Promise.all([state.sb.from('guilds').select('*'), state.sb.from('guild_members').select('*'), state.sb.from('fight_snapshots').select('*').order('at')]);
      if (g.error || m.error || f.error || !Array.isArray(g.data) || !Array.isArray(m.data) || !Array.isArray(f.data)) { state.errors.push('Guilds could not load. Has the guild part of supabase/schema.sql been run?'); return; }
      state.guilds = g.data.map(x => ({ ...x, members: m.data.filter(y => y.guild_id === x.id) }));
      state.snaps = f.data.map(s => ({ id: s.id, at: Math.floor(Date.parse(s.at) / 1000), data: s.data }));
      if (state.session) {
        const r = await state.sb.from('guild_requests').select('*'); state.gReq = Array.isArray(r.data) ? r.data : [];
        const mine = myGuild();
        if (mine && isCaptain(mine)) { const c = await state.sb.rpc('my_invite_code', { p_new: false }); state.invite = c.data || null; }
      }
    }
    computeFights();
  }

  // Players who switched guilds sit out until the Monday after they joined.
  function eligible(m, at) {
    if (!GCFG.switchCooldown || !m.prev_left_at) return true;
    const left = Date.parse(m.prev_left_at) / 1000, joined = Date.parse(m.joined_at) / 1000;
    if (left < S.seasonRange(CFG).start) return true;
    return at >= S.dayToTs(S.weekStartDay(joined, TZ) + 7, TZ);
  }
  function buildSnapshot(snap) {
    const at = snap.at;
    const stats = A.computeStats(state.members, state.scored, state.elo, CFG, at);
    const lastWeek = S.weekStartDay(at, TZ) - 7;
    const runeOf = B.runesFor(S.weeklyTable(state.members, state.scored, lastWeek, CFG, { final: true }));
    const guilds = (snap.data.guilds || []).map(g => {
      const members = (g.members || []).filter(m => eligible(m, at)).sort((a, b) => (a.position || 9) - (b.position || 9)).slice(0, 5).map(m => {
        const p = memberByDiscord(m.discord_id);
        const saved = (snap.data.loadouts || {})[m.discord_id];
        const lo = p ? A.sanitize(saved || state.avatars[avatarKey(p)], p.id, stats[p.id]) : A.defaultLoadout(0, null);
        return { name: p ? p.name : 'Unlinked player', lo, pos: m.position, playerId: p ? p.id : null };
      });
      const runes = [...new Set(members.map(m => runeOf[m.playerId]).filter(Boolean))];
      return { id: g.id, name: guildName(g), tag: guildTag(g), crest: g.crest, members, runes, sittingOut: (g.members || []).length - members.length };
    });
    return { id: snap.id, at, guilds, minMembers: GCFG.minMembers, underdog: GCFG.underdog };
  }
  function computeFights() {
    const { start, end } = S.seasonRange(CFG);
    const built = state.snaps.filter(s => s.at >= start && s.at < end).map(buildSnapshot);
    built.forEach(b => { state.fightSnaps[b.id] = b; });
    state.fights = B.runSeason(built);
  }
  // every guild that fought this season (names as of their latest Fight Night) plus current guilds
  function leagueGuilds() {
    const map = new Map();
    Object.values(state.fightSnaps).sort((a, b) => a.at - b.at).forEach(s => s.guilds.forEach(g => map.set(g.id, { id: g.id, name: g.name, tag: g.tag, crest: g.crest })));
    state.guilds.forEach(g => map.set(g.id, { id: g.id, name: guildName(g), tag: guildTag(g), crest: g.crest }));
    return [...map.values()];
  }
  const guildLeague = () => B.leagueTable(state.fights, leagueGuilds());
  const guildInfo = id => leagueGuilds().find(g => g.id === id) || (id ? { id, name: 'Disbanded guild', tag: '—', crest: {} } : { id: null, name: 'Ancient Guardians', tag: 'BOT', crest: { s: 8, b: 6, f: 4 } });
  function nextFight() {
    const now = state.now, tz = TZ;
    for (let day = S.localDay(now, tz); day < S.localDay(now, tz) + 8; day++) {
      const at = S.dayToTs(day, tz) + GCFG.fightHour * 3600, wd = (day + 4) % 7;
      if (GCFG.fightDays.includes(wd) && at > now) return at;
    }
    return null;
  }
  const nightsDone = () => [...new Set(state.fights.map(r => r.fight))];
  const resultsOf = fid => state.fights.filter(r => r.fight === fid);

  // ---- actions: Supabase functions live, or the same rules in memory for the sample data ----
  async function gApi(fn, args = {}) {
    if (!CFG.demo) {
      const { data, error } = await state.sb.rpc(fn, args);
      if (error) throw new Error(error.message);
      return data;
    }
    const D = state.demoGuilds, me = meDid(), mine = myGuild();
    const fail = m => { throw new Error(m); };
    const needCaptain = () => { if (!mine || mine.captain !== me) fail('Only the captain can do that.'); };
    const add = (g, d) => {
      if (g.members.length >= 5) fail('That guild is full (5 members).');
      const free = [1, 2, 3, 4, 5].find(p => !g.members.some(m => m.position === p));
      const left = (D.log || []).filter(l => l.d === d).map(l => l.at).sort().pop() || null;
      g.members.push({ discord_id: d, position: free, joined_at: new Date(state.now * 1000).toISOString(), prev_left_at: left });
      D.req = state.gReq = D.req.filter(r => r.discord_id !== d);
    };
    const remove = d => {
      const g = D.guilds.find(x => x.members.some(m => m.discord_id === d)); if (!g) return;
      (D.log = D.log || []).push({ d, at: new Date(state.now * 1000).toISOString() });
      g.members = g.members.filter(m => m.discord_id !== d);
      if (g.captain === d) { if (g.members.length) g.captain = g.members[0].discord_id; else D.guilds.splice(D.guilds.indexOf(g), 1); }
    };
    if (fn === 'create_guild') {
      if (mine) fail('Leave your current guild first.');
      if (D.guilds.some(g => g.name.toLowerCase() === args.p_name.trim().toLowerCase())) fail('That name is taken.');
      if (D.guilds.some(g => g.tag.toLowerCase() === args.p_tag.trim().toLowerCase())) fail('That tag is taken.');
      const g = { id: 'g-' + Date.now().toString(36), name: args.p_name.trim(), tag: args.p_tag.trim().toUpperCase(), crest: args.p_crest, captain: me, recruiting: true, members: [] };
      D.guilds.push(g); D.invites[g.id] = 'demo' + Math.random().toString(36).slice(2, 8); add(g, me); return g.id;
    }
    if (fn === 'join_guild') { if (mine) fail('Leave your current guild first.'); const id = Object.keys(D.invites).find(k => D.invites[k] === args.p_code); const g = D.guilds.find(x => x.id === id); if (!g) fail('That invite link is out of date. Ask the captain for a new one.'); add(g, me); return g.id; }
    if (fn === 'request_join') { if (mine) fail('Leave your current guild first.'); const g = D.guilds.find(x => x.id === args.p_guild); if (!g || !g.recruiting) fail('That guild isn\'t recruiting.'); if (!D.req.some(r => r.guild_id === g.id && r.discord_id === me)) D.req.push({ guild_id: g.id, discord_id: me }); return null; }
    if (fn === 'cancel_request') { D.req = state.gReq = D.req.filter(r => !(r.guild_id === args.p_guild && r.discord_id === me)); return null; }
    if (fn === 'answer_request') { needCaptain(); if (!D.req.some(r => r.guild_id === mine.id && r.discord_id === args.p_discord)) fail('That request is gone.'); if (args.p_accept) add(mine, args.p_discord); else D.req = state.gReq = D.req.filter(r => !(r.guild_id === mine.id && r.discord_id === args.p_discord)); return null; }
    if (fn === 'leave_guild') { remove(me); return null; }
    if (fn === 'kick_member') { needCaptain(); remove(args.p_discord); return null; }
    if (fn === 'make_captain') { needCaptain(); mine.captain = args.p_discord; return null; }
    if (fn === 'set_positions') { needCaptain(); const v = Object.values(args.p_positions); if (new Set(v).size !== v.length) fail('Each position 1-5 can be used once.'); mine.members.forEach(m => { if (args.p_positions[m.discord_id]) m.position = args.p_positions[m.discord_id]; }); return null; }
    if (fn === 'update_guild') { needCaptain(); Object.assign(mine, { name: args.p_name.trim(), tag: args.p_tag.trim().toUpperCase(), crest: args.p_crest, recruiting: args.p_recruiting }); return null; }
    if (fn === 'my_invite_code') { needCaptain(); if (args.p_new) D.invites[mine.id] = 'demo' + Math.random().toString(36).slice(2, 8); return D.invites[mine.id]; }
    fail('Unknown action');
  }

  const nameProblem = (name, tag) => {

  // ---- shared bits ----
  const posLabel = p => (p <= 2 ? `Front ${p}` : `Back ${p - 2}`);
  const recordOf = id => { const r = guildLeague().find(x => x.id === id); return r ? r : { w: 0, l: 0, played: 0, rank: null }; };
  function rosterStrip(g) {

  function resultLine(r) {

  // ---- Guilds page ----
  function renderGuilds() {

      else if (mine) panel = `<div class="gpanel">${crestImg(mine.crest, 48)}<div><div class="eyebrow" style="font-size:11px">Your guild${isCaptain(mine) ? ' · Captain' : ''}</div><h3>[${esc(guildTag(mine))}] ${esc(guildName(mine))}</h3><p>${mine.members.length}/5 members · ${guildPower(mine)} power${mine.members.length < GCFG.minMembers ? ` · needs ${GCFG.minMembers - mine.members.length} more to fight` : ''}</p></div><a class="btn-red" href="#guild/${mine.id}">Open guild page</a></div>`;
      else {
        const myReq = state.gReq.filter(r => r.discord_id === meDid());
        panel = `<div class="gpanel create">
          <div class="create-form">
            <h3>Start a guild</h3>
            <div class="row"><label>Name<input id="gName" maxlength="24" placeholder="Radiant Rats"></label><label>Tag<input id="gTag" maxlength="4" placeholder="RAT"></label></div>
            ${crestPicker({ s: 0, b: 0, f: 7 })}
            <button class="btn-red" data-g="create">Create guild</button>
            <p class="hint">Or join one: open an invite link from a captain, or send a request from the list below${myReq.length ? '' : ''}.</p>
            ${myReq.length ? `<div class="myreq"><b>Your requests:</b> ${myReq.map(r => `${esc(guildName(state.guilds.find(g => g.id === r.guild_id)))} <button class="link" data-g="cancel" data-id="${r.guild_id}">Cancel</button>`).join(' · ')}</div>` : ''}
          </div></div>`;
      }
    }
    const lastBlock = last ? `
      <div class="section-head"><div><div class="eyebrow">${fmtDateTime(resultsOf(last)[0].at)}</div><h2>Last Fight Night</h2></div><div class="status" style="margin:0"><span id="gCopyMsg" role="status"></span><button class="btn-red" data-g="copy">Copy for Discord</button></div></div>
      <div class="fight-list">${resultsOf(last).map(resultLine).join('')}</div>` : '';
    const tableBlock = table.length ? `
      <div class="section-head"><div><div class="eyebrow">${esc(CFG.season.name)} · best record wins</div><h2>Guild league</h2></div><a class="btn" href="#duel">Duel sandbox</a></div>
      <table class="table gtable"><thead><tr><th>#</th><th>Guild</th><th class="r">W–L</th><th class="r hide-sm">Enemy HP destroyed</th><th class="r hide-sm">Last 5</th></tr></thead><tbody>
      ${table.map(r => { const g = guildInfo(r.id); return `<tr><td class="rank num ${r.rank && r.rank <= 3 ? 'top' : ''}">${r.rank || '–'}</td><td><a class="plain" href="#guild/${r.id}">${guildLabel(g)}</a></td><td class="r num"><span class="w">${r.w}</span>–<span class="l">${r.l}</span></td><td class="r num hide-sm">${r.played ? Math.round(r.destroyedPct * 100) + '%' : '–'}</td><td class="r hide-sm">${r.last.map(x => `<span class="res ${x}">${x}</span>`).join('')}</td></tr>`; }).join('')}
      </tbody></table>` : '';
    const cards = state.guilds.slice().sort((a, b) => guildPower(b) - guildPower(a)).map(g => {

        <p class="sub">Captain: ${esc(playerName(g.captain))}. ${g.members.length < GCFG.minMembers ? `Needs ${GCFG.minMembers - g.members.length} more member${GCFG.minMembers - g.members.length === 1 ? '' : 's'} to fight. ` : ''}Positions 1–2 are the front line, 3–5 the back line: melee attackers have to get through the front line first.</p></div>

  // ---- one fight (replay) ----
  let arenaCtl = null;
  function renderFight(fid, idx) {
    const view = $('#view-fight'); if (!view) return;

    const a = guildInfo(r.a), b = guildInfo(r.b);
    const rows = res.teams.flatMap((t, ti) => t.units.map(u => ({ ...u, team: ti }))).sort((x, y) => (y.dealt + y.healed) - (x.dealt + x.healed));
    view.innerHTML = `
      <div class="hero compact"><div class="eyebrow">Fight Night · ${fmtDateTime(r.at)}</div>
        <h1 class="long">${esc(a.name)} vs ${esc(b.name)}</h1>
        <p class="tagline">${esc(res.teams[res.winner].name)} won${res.reason === 'time' ? ' on HP left' : ''} · MVP ${esc(r.mvpName)}</p></div>

      ${rows.map(u => `<tr><td>${esc(u.name)}${u.key === res.mvp ? ' <span class="tag cap">MVP</span>' : ''}${u.pet ? ` <span class="petnote">+ ${esc(u.pet)}</span>` : ''}</td><td>${esc(res.teams[u.team].name)}</td><td class="r num">${u.dealt}</td><td class="r num hide-sm">${u.healed}</td><td class="r num">${u.kills}</td><td class="r num hide-sm">${u.hp ? Math.round(u.hp / u.maxHp * 100) + '%' : 'KO'}</td></tr>`).join('')}
      </tbody></table>`;

  // ---- duel sandbox ----
  const duel = { a: null, b: null, seed: 1 };
  function duelTeams() {
    const opts = state.guilds.map(g => ({ v: 'g:' + g.id, label: `[${guildTag(g)}] ${guildName(g)}` }))
      .concat(state.members.map(m => ({ v: 'p:' + m.id, label: `${m.name} + 4 creeps` })));
    return opts;
  }
  function duelTeam(v) {
    if (!v) return null;
    if (v.startsWith('g:')) {
      const g = state.guilds.find(x => 'g:' + x.id === v); if (!g) return null;
      return { id: g.id, name: guildName(g), members: g.members.map(m => { const p = memberByDiscord(m.discord_id); return { name: playerName(m.discord_id), lo: p ? loadoutOf(p.id) : A.defaultLoadout(0, null), pos: m.position, playerId: p ? p.id : null }; }) };
    }
    const p = memberById(Number(v.slice(2))); if (!p) return null;
    return { id: 'p' + p.id, name: p.name, members: [{ name: p.name, lo: loadoutOf(p.id), pos: 3, playerId: p.id }] };
  }
  function renderDuel() {
    const view = $('#view-duel'); if (!view) return;
    if (arenaCtl) { arenaCtl.stop(); arenaCtl = null; }
    const opts = duelTeams();
    if (!duel.a && opts[0]) duel.a = opts[0].v;
    if (!duel.b && opts[1]) duel.b = opts[1].v;
    const sel = (id, cur) => `<select id="${id}">${opts.map(o => `<option value="${esc(o.v)}" ${o.v === cur ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
    view.innerHTML = `
      <div class="hero compact"><div class="eyebrow">Just for fun</div><h1>Duel sandbox</h1>
        <p class="tagline">Pit any two guilds, or any player, against each other. Nothing counts.</p>
        <p class="sub">Everyone fights with the gear they're wearing right now. Each fight rolls new luck, so run it a few times.</p></div>
      <div class="duel-pick">${sel('duelA', duel.a)}<span class="vs">vs</span>${sel('duelB', duel.b)}<button class="btn-red" data-g="duel">Fight!</button></div>
      <div class="arena" id="duelArena"></div>`;
    runDuel();
  }
  function runDuel() {
    const a = duelTeam(duel.a), b = duelTeam(duel.b), el = $('#duelArena');
    if (!a || !b || !el) { if (el) el.innerHTML = '<div class="empty"><strong>Pick two sides.</strong></div>'; return; }
    if (arenaCtl) arenaCtl.stop();
    const res = B.simulate(a, b, `duel|${duel.a}|${duel.b}|${duel.seed}`, { underdog: GCFG.underdog });
    arenaCtl = window.LeagueArena.mount(el, res, { fileName: 'duel' });
  }

  // ---- Discord post for a Fight Night ----
  async function copyFightNight() {
    const nights = nightsDone(), fid = nights[nights.length - 1]; if (!fid) return;
    const list = resultsOf(fid), base = location.href.split('#')[0];
    const lines = [`**${CFG.leagueName} — Fight Night (${fmtDateTime(list[0].at)})**`, ''];
    list.forEach(r => {
      const a = guildInfo(r.a), b = guildInfo(r.b), w = r.winner === 0 ? a : b, l = r.winner === 0 ? b : a;
      lines.push(`⚔️ **[${guildTag(w)}] ${w.name}** beat [${guildTag(l)}] ${l.name} · MVP ${r.mvpName}`);
      lines.push(`   Replay: ${base}#fight/${r.fight}/${r.idx}`);
    });
    const top = guildLeague().filter(r => r.played).slice(0, 3);
    if (top.length) { lines.push('', '🏆 **League**'); top.forEach(r => { const g = guildInfo(r.id); lines.push(`${r.rank}. [${guildTag(g)}] ${g.name} — ${r.w}W ${r.l}L`); }); }
    const nx = nextFight(); if (nx) lines.push('', `Next Fight Night: ${fmtDateTime(nx)}`);
    const msg = $('#gCopyMsg');
    try { await navigator.clipboard.writeText(lines.join('\n')); if (msg) msg.textContent = 'Copied. Paste it in Discord.'; }
    catch { if (msg) msg.textContent = 'Copy failed. Select the text manually.'; }
  }

  function renderGuildViews() {
    const [v, a, b] = location.hash.slice(1).split('/');
    if (v === 'guild') renderGuild(a);
    else if (v === 'fight') renderFight(a, b);
    else if (v === 'duel') renderDuel();
    renderGuilds();
  }

  // one click handler for every guild page
  document.addEventListener('click', async e => {
    const el = e.target.closest('[data-g]'); if (!el || !guildsOn) return;
    const act = el.dataset.g, mine = myGuild(), view = el.closest('.view');
    const val = sel => { const x = view && view.querySelector(sel); return x ? x.value : ''; };
    if (act === 'login') { store.set('returnTo', location.hash.slice(1) || 'guilds'); await state.sb.auth.signInWithOAuth({ provider: 'discord', options: { redirectTo: location.origin + location.pathname } }); return; }
    if (act === 'create' || act === 'save') {
      const name = val('#gName'), tag = val('#gTag'), crest = pickedCrest(view.querySelector('.crest-pick'));
      const bad = nameProblem(name, tag); if (bad) { state.gMsg = '⚠ ' + bad; renderGuildViews(); return; }
      if (act === 'create') return guildAction('create_guild', { p_name: name, p_tag: tag, p_crest: crest }, 'Guild created. Share your invite link to fill the roster.', id => { location.hash = 'guild/' + id; });
      return guildAction('update_guild', { p_name: name, p_tag: tag, p_crest: crest, p_recruiting: view.querySelector('#gRecruit').checked }, 'Saved.');
    }
    if (act === 'request') return guildAction('request_join', { p_guild: el.dataset.id }, 'Request sent. The captain will see it on their guild page.');
    if (act === 'cancel') return guildAction('cancel_request', { p_guild: el.dataset.id }, 'Request cancelled.');
    if (act === 'accept') return guildAction('answer_request', { p_discord: el.dataset.d, p_accept: true }, 'Welcome aboard.');
    if (act === 'decline') return guildAction('answer_request', { p_discord: el.dataset.d, p_accept: false }, 'Request declined.');
    if (act === 'kick') { if (!confirmLike(el)) return; return guildAction('kick_member', { p_discord: el.dataset.d }, 'Removed from the guild.'); }
    if (act === 'captain') { if (!confirmLike(el)) return; return guildAction('make_captain', { p_discord: el.dataset.d }, 'Captaincy handed over.'); }
    if (act === 'leave') { if (!confirmLike(el)) return; return guildAction('leave_guild', {}, 'You left the guild.', () => { location.hash = 'guilds'; }); }
    if (act === 'positions') {
      const pos = {}; view.querySelectorAll('select.pos').forEach(s => { pos[s.dataset.d] = Number(s.value); });
      return guildAction('set_positions', { p_positions: pos }, 'Positions saved. They count from the next Fight Night.');
    }
    if (act === 'newlink') { if (!confirmLike(el)) return; return guildAction('my_invite_code', { p_new: true }, 'New link made. The old one no longer works.'); }

    if (act === 'copy') return copyFightNight();

    if (act === 'duel') { duel.a = val('#duelA'); duel.b = val('#duelB'); duel.seed++; runDuel(); }
  });
  document.addEventListener('change', e => {
    if (e.target.classList.contains("gDemoPick")) { state.locker.playerId = Number(e.target.value); state.locker.draft = null; state.gMsg = ''; loadGuilds().then(renderGuildViews); }
    if (e.target.id === 'duelA' || e.target.id === 'duelB') { duel.a = $('#duelA').value; duel.b = $('#duelB').value; }
  });
  // destructive buttons need a second click
  function confirmLike(el) {
    if (el.dataset.armed) return true;
    el.dataset.armed = '1'; const t = el.textContent; el.textContent = 'Click again to confirm';
    setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.textContent = t; } }, 4000);
    return false;
  }
  // invite links: #join/<code>
  async function handleJoinLink(code) {
    if (!guildsOn) return;
    if (!CFG.demo && !state.session) { store.set('returnTo', 'join/' + code); state.gMsg = 'Log in with Discord to join this guild.'; location.hash = 'guilds'; return; }
    await guildAction('join_guild', { p_code: code }, 'You joined the guild!', id => { location.hash = 'guild/' + id; });
    if (location.hash.startsWith('#join/')) location.hash = 'guilds';    // didn't join: show why on the Guilds page
  }

  // Admin page (not in the menu): open #calibrate to check the party-size points against real results.
  function renderCalibrate() {
    const view = $('#view-calibrate'); if (!view) return;
    const s = CFG.scoring, { start, end } = S.seasonRange(CFG);
    const cap = s.weeklyCap || 24;
    const by = [1, 2, 3, 4, 5].map(n => ({ n, games: 0, wins: 0, points: 0, players: new Set() }));
    for (const m of state.members) for (const e of state.scored[m.id] || []) {
      if (!e.counted || (e.result !== 'win' && e.result !== 'loss') || e.start_time < start || e.start_time >= end) continue;
      const b = by[e.party - 1]; b.games++; b.points += e.points; b.players.add(m.id); if (e.result === 'win') b.wins++;
    }
    const total = by.reduce((a, b) => a + b.games, 0);
    const rowsHtml = by.map(b => {
      const wr = b.games ? b.wins / b.games : null;
      const week = wr == null ? null : Math.round(cap * (wr * s.partyWin[b.n] + (1 - wr) * s.loss));
      return `<tr><td style="white-space:nowrap">${S.partyLabel(b.n)}</td><td class="r num">${b.games}</td><td class="r num">${b.players.size}</td>
        <td class="r num">${wr == null ? '–' : Math.round(wr * 100) + '%'}</td><td class="r num">${signed(s.partyWin[b.n])}</td>
        <td class="r num">${b.games ? (b.points / b.games).toFixed(1) : '–'}</td><td class="r num">${week == null ? '–' : week}</td></tr>`;
    }).join('');
    view.innerHTML = `
      <div class="hero"><div class="eyebrow">Admin</div><h1 class="long">Calibrate</h1>
        <p class="tagline">Are the party-size points fair for this community?</p>
        <p class="sub">Every counted ${modesAnd} game this season, by party size. A game played by a five-stack of members counts once per member.</p></div>
      <div class="rules">
        ${total ? `<div style="overflow-x:auto"><table class="table" style="min-width:560px"><thead><tr><th>Party</th><th class="r">Games</th><th class="r">Players</th><th class="r">Win rate</th><th class="r">Win pts</th><th class="r">Avg pts / game</th><th class="r">${cap}-game week</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>`
          : '<div class="empty"><strong>No games yet.</strong>Come back after a week or two of play.</div>'}
        <h2>How to read it</h2>
        <ul>
          <li><b>${cap}-game week</b> is what a full week scores at that party size's real win rate. If one size is far ahead of the others, lower its win points (or raise the others) in <code>scoring.partyWin</code> in config.js.</li>
          <li>Wait for at least 30–50 games per party size before changing anything; small samples swing a lot.</li>
          <li>Changes apply to the whole season when the page reloads, so adjust between seasons or announce it in Discord first.</li>
        </ul>
      </div>`;
  }

  // Home page explainer: a file in the site (click to play, with sound) or a YouTube link. Built once and reused.
  let explainerEl = null;
  function explainerNode() {
    if (explainerEl) return explainerEl;
    const src = String(CFG.explainerVideo || ''), frame = document.createElement('div');
    frame.className = 'frame';
    const yt = src.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
    if (yt) {
      frame.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${yt[1]}?rel=0" title="How ${esc(CFG.leagueName)} works" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe>`;
    } else {
      frame.innerHTML = `<video playsinline preload="none"${CFG.explainerPoster ? ` poster="${esc(CFG.explainerPoster)}"` : ''} src="${esc(src)}" aria-label="How ${esc(CFG.leagueName)} works, 40-second video"></video><button class="play" type="button" aria-label="Play the video"><span></span></button>`;
      const v = frame.querySelector('video'), b = frame.querySelector('.play');
      b.onclick = () => { b.hidden = true; v.controls = true; v.play().catch(() => { b.hidden = false; }); };   // controls appear once it starts
      v.addEventListener('play', () => { b.hidden = true; v.controls = true; });
      v.addEventListener('ended', () => { b.hidden = false; });
    }
    return (explainerEl = frame);
  }

  function renderHome() {
    const view = $('#view-home'); if (!view) return;
    const thisWeek = S.weekStartDay(state.now, TZ);
    const weekRows = S.weeklyTable(state.members, state.scored, thisWeek, CFG).filter(r => r.games > 0);
    const seasonStart = S.dayToTs(S.seasonWeeks(CFG)[0], TZ);
    const invite = CFG.discordInvite;

    // the stage: real players when there are enough of them, otherwise a showcase cast
    let cast = SHOWCASE.map(c => ({ ...c, name: '' }));
    if (FEAT.avatars && state.members.length >= 5) {
      const season = S.seasonTable(state.members, state.scored, CFG).rows.slice(0, 5);
      const order = [3, 1, 0, 2, 4];                              // best player in the middle
      cast = order.map((k, i) => {
        const r = season[k]; if (!r) return SHOWCASE[i];
        const t = tauntOf(r.id);
        return { lo: loadoutOf(r.id), anim: t.anim !== 'none' ? t.anim : SHOWCASE[i].anim, line: k === 0 ? t.text : '', name: r.name };
      });
    }
    const stage = FEAT.avatars ? `<div class="parade" aria-hidden="true">${cast.map((c, i) => {
      const [left, size, z] = STAGE[i];
      const star = i === 2;
      return `<div class="actor" style="left:${left}%;width:${size}%;z-index:${z}">${star && c.line ? `<div class="bubble">${esc(c.line)}</div>` : ''}<img src="${A.toDataURL(c.lo, 0, c.anim)}"${animAttr(c.lo, c.anim)} alt="">${star && c.name ? `<div class="tag">${esc(c.name)} · season leader</div>` : ''}</div>`;
    }).join('')}</div>` : '';

    const top = weekRows.slice(0, 3);
    const topHtml = top.length
      ? `<div class="home-strip">${top.map((r, i) => `<div class="mini" style="--c:${['var(--gold)', 'var(--silver)', 'var(--bronze)'][i]}">${FEAT.avatars ? `<img src="${A.toDataURL(loadoutOf(r.id), 0, 'idle')}"${animAttr(loadoutOf(r.id))} alt="">` : ''}<div><div class="eyebrow" style="font-size:11px;color:${['var(--gold)', 'var(--silver)', 'var(--bronze)'][i]}">${['First', 'Second', 'Third'][i]}</div><div class="who">${esc(r.name)}</div><div class="val"><b class="num">${r.points}</b> points this week</div></div></div>`).join('')}</div>`
      : `<div class="empty"><strong>${state.now < seasonStart ? `${esc(CFG.season.name)} starts ${fmtDay(seasonStart)}` : 'Nobody has scored yet this week'}</strong>Play a ${modesOr} game to take the first spot.</div>`;

    const gearPick = ['lasthit_dagger', 'tp_sandals', 'creep_buckler', 'night_foal', 'farm_sickle', 'rampage_helm', 'second_life_shield', 'weekly_crown', 'backdoor_greaves', 'drop_mimic', 'crit_blade', 'bloodmoon'];
    const gear = FEAT.avatars ? A.SLOTS.flatMap(sl => sl.items.filter(it => gearPick.includes(it.id)).map(it => ({ sl: sl.id, it })))
      .sort((a, b) => gearPick.indexOf(a.it.id) - gearPick.indexOf(b.it.id)) : [];
    const total = A.SLOTS.flatMap(sl => sl.items.filter(i => !i.free)).length;
    const sc = CFG.scoring;

    view.innerHTML = `
      <div class="hero">
        <div class="home-hero">
          <div>
            <div class="eyebrow">A Dota 2 community league</div>
            <h1>${esc(CFG.leagueName)}</h1>
            <p class="tagline">Play your normal games. Score every week. Dress your pixel hero.</p>
            <p class="sub">Every ${modesAnd} match you play counts automatically. Top the weekly board, unlock gear from what you actually do in game, and taunt your friends from the podium.</p>
            <div class="ctas">
              <a class="btn-red" href="#weekly">See this week's standings</a>
              ${invite ? `<a class="btn" href="${esc(invite)}" target="_blank" rel="noopener">Join the Discord</a>` : `<button class="btn" data-home="join">How to join</button>`}
              ${CFG.explainerVideo ? '<button class="btn" data-home="video">▶ Watch the 40s explainer</button>' : ''}
            </div>
          </div>
          ${stage}
        </div>
      </div>

      ${CFG.explainerVideo ? `<section class="explainer" id="home-video" aria-labelledby="explainerTitle">
        <div class="section-head"><div><div class="eyebrow">New here?</div><h2 id="explainerTitle">Watch how it works<span class="dur">40 sec</span></h2></div></div>
        <div id="home-video-slot"></div>
      </section>` : ''}

      <div class="section-head"><div><div class="eyebrow">Live</div><h2>This week so far</h2></div><a class="btn" href="#weekly">Full standings</a></div>
      ${topHtml}

      <div class="section-head" id="home-join"><div><div class="eyebrow">Three steps</div><h2>How it works</h2></div></div>
      <ol class="steps">
        <li><h3>Link your account</h3><p>Turn on Expose Public Match Data in Dota 2 (Settings › Options › Social), then ${selfLink ? 'log in with Discord on the <a href="#register">Join</a> page and enter your Friend ID' : 'post your Friend ID in #register on our Discord'}.</p></li>
        <li><h3>Play like you always do</h3><p>${modesAnd} games score automatically. Solo wins are worth the most and every loss still earns points, so solo players and five-stacks can both top the week.</p></li>
        <li><h3>Climb, unlock, show off</h3><p>${guildsOn ? 'Unlock gear, join a guild, and send your avatars into battle every Fight Night. Top the weekly board to taunt from the podium.' : 'Top the weekly board, chase Season Champion, unlock gear for your avatar, and taunt from the top 3.'}</p></li>
      </ol>

      ${gear.length ? `<div class="section-head"><div><div class="eyebrow">${total} pieces to unlock</div><h2>Earn your gear</h2></div>${FEAT.avatars ? '<a class="btn" href="#avatar">Open your locker</a>' : ''}</div>
      <div class="gear-show">${gear.map(({ sl, it }) => { const r = rarityOf(it); return `<div class="g" style="--rc:${r.color}">${iconTile(sl, it, null)}<div><div class="rar">${r.name}</div><div class="n">${esc(it.name)}</div></div></div>`; }).join('')}</div>
      <p class="lead" style="margin-top:12px">Gear unlocks from what you do: last hits, denies, tower damage, comebacks, late-night games, win streaks, topping the week. Even losing streaks earn something.</p>` : ''}

      ${guildsOn ? homeGuildBlock() : ''}
      <div class="section-head"><div><div class="eyebrow">Scoring</div><h2>Points at a glance</h2></div><a class="btn" href="#rules">All the rules</a></div>
      <div class="score-chips">
        <span><b>${signed(sc.partyWin[1])}</b>Solo win</span><span><b>${signed(sc.partyWin[2])}</b>Duo win</span><span><b>${signed(sc.partyWin[5])}</b>5-stack win</span>
        <span><b>${signed(sc.loss)}</b>Any loss</span><span><b>${sc.weeklyCap}</b>Games a week max</span>
        <span><b>${signed(sc.abandon)}</b>Abandon</span>
      </div>

      <div class="section-head"><div><div class="eyebrow">Questions</div><h2>Before you join</h2></div></div>
      <div class="faq">
        <details><summary>Is it free?</summary><p>Yes. There's nothing to buy, and gear can only be earned by playing.</p></details>
        <details><summary>Do I need to install anything?</summary><p>No. Your games are read from public match data, so you just play Dota as normal.</p></details>
        <details><summary>What does Expose Public Match Data share?</summary><p>Your match history and in-game stats, the same data stats sites already show. It doesn't share your account login or anything outside Dota.</p></details>
        <details><summary>When does the week reset?</summary><p>Every Monday at 00:00 Malaysia time. Results are posted in Discord that morning.</p></details>
        <details><summary>Is this an official Dota 2 site?</summary><p>No. ${esc(CFG.leagueName)} is a fan-run community league and isn't affiliated with or endorsed by Valve.</p></details>
      </div>

      <div class="cta-band">
        <h2>Your next game counts</h2>
        <p>Link your account, play a match, and see your name on the board.</p>
        <div class="ctas">${invite ? `<a class="btn-red" href="${esc(invite)}" target="_blank" rel="noopener">Join the Discord</a>` : `<a class="btn-red" href="#register">Register a player</a>`}<a class="btn" href="#weekly">See the standings</a></div>
      </div>`;
    const slot = view.querySelector('#home-video-slot'); if (slot) slot.replaceWith(explainerNode());   // same player across re-renders, so playback never resets
    view.onclick = ev => {
      if (ev.target.closest('[data-home="join"]')) $('#home-join').scrollIntoView({ behavior: 'smooth', block: 'start' });
      if (ev.target.closest('[data-home="video"]')) { const v = $('#home-video'); if (v) v.scrollIntoView({ behavior: 'smooth', block: 'start' }); const pl = $('#home-video .play'); if (pl && !pl.hidden) pl.focus({ preventScroll: true }); }
    };
  }

  // ---------- routing ----------
  const VIEWS = ['home', 'weekly', 'league', 'season', 'avatar', 'rules', 'register', 'calibrate', 'guilds', 'guild', 'fight', 'duel', 'admin']
    .filter(v => (v !== 'admin' || selfLink) && (v !== 'league' || FEAT.league) && (v !== 'avatar' || FEAT.avatars) && (!['guilds', 'guild', 'fight', 'duel'].includes(v) || guildsOn));
  function route() {
    const [h, arg] = location.hash.slice(1).split('/');
    if (h === 'join' && arg) { if (state.ready) handleJoinLink(arg); else state.pendingJoin = arg; return; }
    const v = VIEWS.includes(h) ? h : 'home';
    if (guildsOn && ['guild', 'fight', 'duel'].includes(v) && state.ready && !state.loading) renderGuildViews();
    if (v === 'admin' && !CFG.demo && state.admin.isAdmin == null && !state.admin.checking) checkAdmin();
    else if (arenaCtl && !['fight', 'duel'].includes(v)) { arenaCtl.stop(); arenaCtl = null; }
    VIEWS.forEach(n => $('#view-' + n).classList.toggle('active', n === v));
    document.querySelectorAll('nav.tabs a').forEach(a => {
      const target = ['guild', 'fight', 'duel'].includes(v) ? 'guilds' : v;
      if (a.getAttribute('href') === '#' + target) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
  }

  function renderAll() {
    renderBanner(); renderStatus(); renderHome(); renderWeekly(); if (FEAT.league) renderLeague(); renderSeason(); if (FEAT.avatars) renderAvatar(); renderRules(); renderRegister(); if (selfLink) renderAdmin(); renderCalibrate(); if (guildsOn) renderGuildViews(); route();
  }

  // ---------- boot ----------
  document.querySelectorAll('[data-feature]').forEach(el => { if (!FEAT[el.dataset.feature]) el.remove(); });
  if (!FEAT.league) $('#view-league').remove();
  if (!FEAT.avatars) $('#view-avatar').remove();
  if (!guildsOn) ['guilds', 'guild', 'fight', 'duel'].forEach(v => $('#view-' + v).remove());
  if (!selfLink) $('#view-admin').remove();
  else { $('#navRegister').textContent = 'Join'; if (CFG.demo) $('#adminLink').hidden = false; }
  document.title = CFG.leagueName;
  $('#leagueName').textContent = CFG.leagueName;
  if (CFG.discordInvite) { const j = $('#joinBtn'); j.href = CFG.discordInvite; j.hidden = false; j.target = '_blank'; j.rel = 'noopener'; }
  window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });
  renderRules(); renderRegister(); route();
  initLogin().catch(() => state.errors.push('Avatar login is unavailable right now.')).finally(() => load(false));
})();
</script>
</body>
</html>
